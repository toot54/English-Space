        function handleRemoteEvent(data) {
            if (data.type === 'teacher_move_local') {
                handleTeacherMoveData(data);
            } else if (data.type === 'teacher_zoom') {
                if (role === 'student' && followMode) { targetFollowScale = data.boardScale; targetFollowX = data.boardX; targetFollowY = data.boardY; }
            } else if (data.type === 'follow_toggle') {
                followMode = data.followMode; updateStudentPanLock();
            } else if (data.type === 'draw_seg') {
                renderSmoothPath(ctx, [data.p0, data.p1], data.color, data.strokeTool, data.size);
            } else if (data.type === 'draw_commit') {
                strokeHistory.push(data.stroke);
                actionHistory.push({ kind: 'stroke', stroke: data.stroke });
                if (data.stroke.strokeTool === 'highlighter') renderSmoothPath(ctx, data.stroke.points, data.stroke.color, data.stroke.strokeTool, data.stroke.size);
                saveBoardState();
            } else if (data.type === 'strokes_sync') {
                strokeHistory = data.strokeHistory || []; redrawAllStrokes();
            } else if (data.type === 'clear') {
                clearBoard(false);
            } else if (data.type === 'reset_all') {
                strokeHistory = []; redrawAllStrokes(); dynamicItems.innerHTML = '';
            } else if (data.type === 'chat_msg' && data.msg) {
                chatHistory.push(data.msg);
                renderChatMessages();
            } else if (data.type === 'widget_move') {
                const w = document.getElementById(data.id); if (w) { w.style.left = data.left + 'px'; w.style.top = data.top + 'px'; }
            } else if (data.type === 'widget_resize') {
                const w = document.getElementById(data.id); if (w) { w.style.width = data.width + 'px'; w.style.height = data.height + 'px'; }
            } else if (data.type === 'widget_lock') {
                const w = document.getElementById(data.id); if (w) w.classList.toggle('locked-widget', data.isLocked);
            } else if (data.type === 'item_display') {
                const w = document.getElementById(data.id); if (w) w.style.display = data.display;
            } else if (data.type === 'spawn_video') {
                createVideoWidget(data.data, false, false);
            } else if (data.type === 'video_chunks_ready') {
                loadSyncedVideoFromFirebase(data.id);
            } else if (data.type === 'spawn_essay') {
                createEssayWidget(data.data, false, false);
            } else if (data.type === 'spawn_photo') {
                spawnPhotoWidget(data.data, false, false);
            } else if (data.type === 'spawn_sticker') {
                createSticker(data.data, false, false);
            } else if (data.type === 'sticker_theme') {
                setStickerTheme(data.id, data.theme, false);
            } else if (data.type === 'spawn_speaking') {
                createSpeakingWidget(data.data, false, false);
            } else if (data.type === 'speaking_preset') {
                selectSpeakingPreset(data.id, data.seconds, false);
            } else if (data.type === 'speaking_toggle_timer') {
                const st = speakingTimers[data.id]; if (st) { st.remaining = data.remaining; st.running = !data.running; toggleSpeakingTimer(data.id, false); }
            } else if (data.type === 'speaking_audio') {
                const audioEl = document.getElementById(`spk-audio-${data.id}`); if (audioEl) audioEl.src = data.src;
            } else if (data.type === 'spawn_dict') {
                createDictWidget(data.data, false, false);
            } else if (data.type === 'dict_lookup') {
                lookupDictionary(data.id, false, data.word);
            } else if (data.type === 'spawn_text_node') {
                createTextNode(data.data, false, false);
            } else if (data.type === 'text_node_update') {
                const el = document.querySelector(`#${data.id} .board-text-content`); if (el && document.activeElement !== el) el.innerText = data.text;
            } else if (data.type === 'text_node_resize') {
                const node = document.getElementById(data.id); const el = document.querySelector(`#${data.id} .board-text-content`);
                if (node && el) { node.dataset.fontSize = data.fontSize; el.style.fontSize = data.fontSize + 'px'; }
            } else if (data.type === 'sticker_text') {
                const el = document.querySelector(`#${data.id} textarea`); if (el) el.value = data.text;
            } else if (data.type === 'essay_update') {
                const el = document.querySelector(`#${data.id} textarea`); if (el) el.value = data.text; updateEssayCounter(data.id, data.text);
            } else if (data.type === 'video_control') {
                const v = document.querySelector(`#${data.id} video`);
                const hint = document.getElementById(`vid-unmute-${data.id}`);
                if (!v) return; v.dataset.remote = '1';
                if (Math.abs(v.currentTime - data.time) > 0.5) v.currentTime = data.time;
                if (data.action === 'play') {
                    v.muted = false;
                    v.play().catch(() => {
                        v.muted = true; v.play().catch(() => {});
                        if (hint) hint.style.display = 'block';
                    });
                } else if (data.action === 'pause') v.pause();
                setTimeout(() => { v.dataset.remote = '0'; }, 180);
            } else if (data.type === 'timer_sync') {
                remainingSeconds = data.remainingSeconds;
                timerPaused = !!data.paused;
                updateTimerPauseUI(data.active);
                renderTimerText();
            } else if (data.type === 'webrtc_signal') {
                handleWebRTCSignal(data);
            }
        }

        // ================= WEBRTC ВИДЕОСВЯЗЬ И ГОЛОС (IPAD + ПК) =================
        const RTC_CONFIG = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun.cloudflare.com:3478' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
            ]
        };

        let pc = null;
        let localStream = null;
        let remoteVideoStream = new MediaStream();
        let remoteAudioStream = new MediaStream();
        let micActive = false;
        let cameraActive = false;
        let remoteSoundMuted = false;
        let makingOffer = false;
        let ignoreOffer = false;
        let pendingIceCandidates = [];
        let rtcSignalRef = null;

        function setRtcStatus(text) {
            const el = document.getElementById('rtc-status-bar');
            if (el) el.innerText = text;
        }

        function sendRtcSignal(payload) {
            const msg = { ...payload, type: 'webrtc_signal', sender: myClientId, senderRole: role, ts: Date.now() };
            try { localChannel.postMessage(msg); } catch (e) {}
            if (rtcSignalRef) { try { rtcSignalRef.push(msg).catch(() => {}); } catch (e) {} }
        }

        function ensurePeerConnection() {
            if (pc && pc.connectionState !== 'closed' && pc.connectionState !== 'failed') return pc;
            if (pc) { try { pc.close(); } catch (e) {} }

            pc = new RTCPeerConnection(RTC_CONFIG);
            remoteVideoStream = new MediaStream();
            remoteAudioStream = new MediaStream();

            if (localStream) {
                localStream.getTracks().forEach(track => { pc.addTrack(track, localStream); });
            }

            pc.onicecandidate = (e) => {
                if (e.candidate) sendRtcSignal({ kind: 'ice', candidate: e.candidate.toJSON() });
            };

            pc.onconnectionstatechange = () => {
                if (!pc) return;
                if (pc.connectionState === 'connected') setRtcStatus('Видео и звук подключены');
                else if (pc.connectionState === 'connecting') setRtcStatus('Соединение...');
                else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') setRtcStatus('Нажмите для переподключения');
            };

            pc.ontrack = (e) => {
                const track = e.track;
                const targetSlot = (role === 'teacher') ? 'student' : 'teacher';
                if (track.kind === 'video') {
                    remoteVideoStream.getVideoTracks().forEach(t => remoteVideoStream.removeTrack(t));
                    remoteVideoStream.addTrack(track);
                    const videoEl = document.getElementById(targetSlot === 'teacher' ? 'teacherVideo' : 'studentVideo');
                    const placeholderEl = document.getElementById(targetSlot === 'teacher' ? 'teacher-placeholder' : 'student-placeholder');
                    if (videoEl) {
                        videoEl.muted = true;
                        videoEl.srcObject = null;
                        videoEl.srcObject = remoteVideoStream;
                        videoEl.play().catch(() => {});
                    }
                    if (placeholderEl) placeholderEl.style.display = 'none';
                } else if (track.kind === 'audio') {
                    remoteAudioStream.getAudioTracks().forEach(t => remoteAudioStream.removeTrack(t));
                    remoteAudioStream.addTrack(track);
                    remoteVoicePlayer.srcObject = null;
                    remoteVoicePlayer.srcObject = remoteAudioStream;
                    remoteVoicePlayer.muted = remoteSoundMuted;
                    remoteVoicePlayer.play().catch(() => { setRtcStatus('Коснитесь экрана для звука'); });
                }
                setRtcStatus('Видео и звук подключены');
            };
            return pc;
        }

        async function makeWebRTCOffer() {
            const conn = ensurePeerConnection();
            try {
                makingOffer = true;
                const offer = await conn.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
                if (conn.signalingState !== 'stable') return;
                await conn.setLocalDescription(offer);
                sendRtcSignal({ kind: 'sdp', description: { type: conn.localDescription.type, sdp: conn.localDescription.sdp }, hasVideo: cameraActive, hasAudio: micActive });
            } catch (e) {} finally { makingOffer = false; }
        }

        async function handleWebRTCSignal(data) {
            if (!data || data.sender === myClientId) return;
            const conn = ensurePeerConnection();
            const polite = (role === 'student') || (myClientId < data.sender);

            try {
                if (data.kind === 'hello') {
                    sendRtcSignal({ kind: 'media_state', hasVideo: cameraActive, hasAudio: micActive });
                    await makeWebRTCOffer();
                } else if (data.kind === 'sdp' && data.description) {
                    const desc = data.description;
                    const offerCollision = (desc.type === 'offer') && (makingOffer || conn.signalingState !== 'stable');
                    ignoreOffer = !polite && offerCollision;
                    if (ignoreOffer) return;

                    if (offerCollision) {
                        await Promise.all([conn.setLocalDescription({ type: 'rollback' }), conn.setRemoteDescription(new RTCSessionDescription(desc))]);
                    } else {
                        await conn.setRemoteDescription(new RTCSessionDescription(desc));
                    }

                    while (pendingIceCandidates.length > 0) {
                        const c = pendingIceCandidates.shift();
                        try { await conn.addIceCandidate(new RTCIceCandidate(c)); } catch (err) {}
                    }

                    if (desc.type === 'offer') {
                        const answer = await conn.createAnswer();
                        await conn.setLocalDescription(answer);
                        sendRtcSignal({ kind: 'sdp', description: { type: conn.localDescription.type, sdp: conn.localDescription.sdp }, hasVideo: cameraActive, hasAudio: micActive });
                    }
                    if (data.hasVideo !== undefined || data.hasAudio !== undefined) {
                        const targetSlot = (role === 'teacher') ? 'student' : 'teacher';
                        updateRemotePlaceholder(targetSlot, data.hasVideo, data.hasAudio);
                    }
                } else if (data.kind === 'ice' && data.candidate) {
                    if (conn.remoteDescription && conn.remoteDescription.type) {
                        try { await conn.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (err) {}
                    } else { pendingIceCandidates.push(data.candidate); }
                } else if (data.kind === 'media_state') {
                    const targetSlot = (role === 'teacher') ? 'student' : 'teacher';
                    updateRemotePlaceholder(targetSlot, data.hasVideo, data.hasAudio);
                }
            } catch (err) {}
        }

        function initWebRTC() {
            ensurePeerConnection();
            if (roomRef) {
                rtcSignalRef = roomRef.child('rtcSignals');
                rtcSignalRef.remove().then(() => {
                    rtcSignalRef.on('child_added', (snap) => {
                        const val = snap.val();
                        if (!val || val.sender === myClientId) return;
                        handleWebRTCSignal(val);
                    });
                    sendRtcSignal({ kind: 'hello' });
                }).catch(() => {});
            }
        }

        function reconnectWebRTC() {
            unlockAudioPlayback();
            setRtcStatus('Обновление связи...');
            if (pc) { try { pc.close(); } catch (e) {} pc = null; }
            ensurePeerConnection();
            sendRtcSignal({ kind: 'hello' });
            makeWebRTCOffer();
        }

        function cleanupWebRTC() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (pc) { try { pc.close(); } catch (e) {} }
        }

        function unlockAudioPlayback() {
            if (remoteVoicePlayer && remoteVoicePlayer.srcObject && remoteVoicePlayer.paused) {
                remoteVoicePlayer.play().catch(() => {});
            }
            ['teacherVideo', 'studentVideo'].forEach(id => {
                const v = document.getElementById(id);
                if (v && v.srcObject && v.paused) v.play().catch(() => {});
            });
        }

        function updateRemotePlaceholder(slotRole, hasVideo, hasAudio) {
            const placeholderEl = document.getElementById(slotRole === 'teacher' ? 'teacher-placeholder' : 'student-placeholder');
            if (!placeholderEl) return;
            placeholderEl.style.display = hasVideo ? 'none' : 'block';
            const label = slotRole === 'teacher' ? 'Преподаватель' : 'Ученик';
            placeholderEl.innerText = hasAudio ? `${label} (Голос активен)` : `Камера (${label})`;
        }

        function showLocalPreview() {
            const videoEl = document.getElementById(role === 'teacher' ? 'teacherVideo' : 'studentVideo');
            const placeholderEl = document.getElementById(role === 'teacher' ? 'teacher-placeholder' : 'student-placeholder');
            if (!videoEl || !placeholderEl) return;
            videoEl.muted = true;
            if (cameraActive && localStream) {
                videoEl.srcObject = null;
                videoEl.srcObject = localStream;
                videoEl.play().catch(() => {});
                placeholderEl.style.display = 'none';
            } else {
                videoEl.srcObject = null;
                placeholderEl.style.display = 'block';
                const label = role === 'teacher' ? 'Преподаватель' : 'Ученик';
                placeholderEl.innerText = micActive ? `${label} (Голос активен)` : `Камера (${label})`;
            }
        }

        async function attachOrReplaceTrack(newTrack) {
            const conn = ensurePeerConnection();
            const sender = conn.getSenders().find(s => s.track && s.track.kind === newTrack.kind);
            if (sender) await sender.replaceTrack(newTrack);
            else conn.addTrack(newTrack, localStream);
            sendRtcSignal({ kind: 'media_state', hasVideo: cameraActive, hasAudio: micActive });
            await makeWebRTCOffer();
        }

        async function toggleMic() {
            unlockAudioPlayback();
            const micBtn = document.getElementById('btn-mic-toggle');
            if (localStream && localStream.getAudioTracks().length > 0) {
                micActive = !micActive;
                localStream.getAudioTracks().forEach(t => t.enabled = micActive);
                micBtn.classList.toggle('lit', micActive);
                micBtn.innerText = micActive ? 'Микрофон вкл' : 'Микрофон выкл';
                showLocalPreview();
                sendRtcSignal({ kind: 'media_state', hasVideo: cameraActive, hasAudio: micActive });
                return;
            }
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: false });
                const audioTrack = audioStream.getAudioTracks()[0];
                if (!localStream) localStream = new MediaStream();
                localStream.addTrack(audioTrack);
                micActive = true;
                micBtn.classList.add('lit');
                micBtn.innerText = 'Микрофон вкл';
                showLocalPreview();
                await attachOrReplaceTrack(audioTrack);
            } catch (err) { alert('Разрешите доступ к микрофону в настройках браузера.'); }
        }

        function toggleRemoteSound() {
            remoteSoundMuted = !remoteSoundMuted;
            const soundBtn = document.getElementById('btn-sound-toggle');
            soundBtn.classList.toggle('lit', !remoteSoundMuted);
            soundBtn.innerText = remoteSoundMuted ? 'Звук выкл' : 'Звук вкл';
            if (remoteVoicePlayer) {
                remoteVoicePlayer.muted = remoteSoundMuted;
                if (!remoteSoundMuted) remoteVoicePlayer.play().catch(() => {});
            }
        }

        async function toggleCamera() {
            unlockAudioPlayback();
            const camBtn = document.getElementById('btn-cam-toggle');
            if (cameraActive && localStream) {
                localStream.getVideoTracks().forEach(track => { track.stop(); localStream.removeTrack(track); });
                cameraActive = false;
                camBtn.classList.remove('lit');
                showLocalPreview();
                sendRtcSignal({ kind: 'media_state', hasVideo: cameraActive, hasAudio: micActive });
                await makeWebRTCOffer();
                return;
            }
            try {
                const media = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 480 }, height: { ideal: 360 }, facingMode: 'user' },
                    audio: (!localStream || localStream.getAudioTracks().length === 0)
                });
                if (!localStream) localStream = new MediaStream();
                const videoTrack = media.getVideoTracks()[0];
                if (videoTrack) {
                    localStream.addTrack(videoTrack);
                    cameraActive = true;
                    camBtn.classList.add('lit');
                    await attachOrReplaceTrack(videoTrack);
                }
                const audioTrack = media.getAudioTracks()[0];
                if (audioTrack) {
                    localStream.addTrack(audioTrack);
                    micActive = true;
                    const micBtn = document.getElementById('btn-mic-toggle');
                    micBtn.classList.add('lit');
                    micBtn.innerText = 'Микрофон вкл';
                    await attachOrReplaceTrack(audioTrack);
                }
                showLocalPreview();
            } catch (err) { alert('Разрешите доступ к камере и микрофону.'); }
        }

        initRealtimeSync();
        initWebRTC();
    </script>
