<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Space — Класс</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-page: #f3f5f4;
            --bg-surface: #ffffff;
            --bg-subtle: #f7f9f8;
            --bg-hover: #edf2f0;
            --text-primary: #111815;
            --text-secondary: #5c6661;
            --text-muted: #8c9691;
            --border: #e2e7e4;
            --border-strong: #cbd4cf;
            --emerald: #0d7350;
            --emerald-hover: #0a5c40;
            --emerald-soft: #e6f4ef;
            --emerald-border: #a7dbc6;
            --danger: #b91c1c;
            --danger-soft: #fef2f2;
            --danger-border: #fecaca;
            --dot-color: #cbd4cf;
        }

        body.dark-theme {
            --bg-page: #0f1412;
            --bg-surface: #171d1a;
            --bg-subtle: #1d2521;
            --bg-hover: #252f2a;
            --text-primary: #f0f4f2;
            --text-secondary: #9ca8a2;
            --text-muted: #68736e;
            --border: #26302b;
            --border-strong: #35423c;
            --emerald: #109468;
            --emerald-hover: #14ad7a;
            --emerald-soft: rgba(16, 148, 104, 0.16);
            --emerald-border: rgba(16, 148, 104, 0.42);
            --danger: #f87171;
            --danger-soft: rgba(239, 68, 68, 0.14);
            --danger-border: rgba(239, 68, 68, 0.35);
            --dot-color: #2b3631;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        }
        html, body {
            overflow: hidden; background: var(--bg-page); color: var(--text-primary);
            height: 100%; width: 100%; position: fixed; inset: 0; touch-action: none;
        }

        .classroom-layout {
            display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden;
        }

        /* Верхняя шапка урока */
        .class-topbar {
            height: 52px; background: var(--bg-surface); border-bottom: 1px solid var(--border);
            padding: 0 18px; display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-shrink: 0; z-index: 130;
        }
        .topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; }
        .lesson-title-text {
            font-size: 14px; font-weight: 800; color: var(--text-primary);
            max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .top-tab-badge {
            height: 52px; display: inline-flex; align-items: center; padding: 0 12px;
            font-size: 13px; font-weight: 700; color: var(--text-primary);
            border-bottom: 2.5px solid var(--emerald);
        }

        /* Таймер урока */
        .timer-wrap {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg-subtle); border: 1px solid var(--border);
            padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 700;
            font-variant-numeric: tabular-nums; color: var(--text-secondary);
        }
        .timer-dot {
            width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted);
        }
        .timer-dot.running { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
        .timer-dot.paused { background: #d97706; }

        /* Панель инструментов доски */
        .class-subbar {
            height: 48px; background: var(--bg-surface); border-bottom: 1px solid var(--border);
            padding: 0 18px; display: flex; align-items: center; justify-content: space-between;
            gap: 10px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; z-index: 125;
        }
        .class-subbar::-webkit-scrollbar { display: none; }
        .tool-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .bar-divider { width: 1px; height: 20px; background: var(--border); margin: 0 3px; flex-shrink: 0; }

        .btn, .tool-pill {
            height: 32px; padding: 0 12px; border-radius: 8px;
            border: 1px solid var(--border-strong); background: var(--bg-surface);
            color: var(--text-primary); font-size: 12px; font-weight: 600;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; transition: 0.14s; white-space: nowrap; flex-shrink: 0;
        }
        .btn:hover, .tool-pill:hover { background: var(--bg-hover); }
        .tool-pill.active, .btn.active {
            background: var(--emerald-soft); border-color: var(--emerald);
            color: var(--emerald); font-weight: 700;
        }
        .tool-pill.disabled-pan { opacity: 0.38; pointer-events: none; }
        .btn-emerald { background: var(--emerald); border-color: var(--emerald); color: #fff; font-weight: 700; }
        .btn-emerald:hover { background: var(--emerald-hover); }
        .btn-danger-outline {
            background: var(--bg-surface); border-color: var(--danger-border); color: var(--danger); font-weight: 700;
        }
        .btn-danger-outline:hover { background: var(--danger-soft); }
        .btn-icon-only { width: 32px; padding: 0; }

        .color-swatch-row { display: flex; align-items: center; gap: 5px; padding: 0 2px; }
        .color-dot {
            width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
            border: 2px solid var(--bg-surface); box-shadow: 0 0 0 1px var(--border-strong);
            transition: 0.12s; flex-shrink: 0;
        }
        .color-dot.active { box-shadow: 0 0 0 2px var(--emerald); transform: scale(1.12); }

        .size-slider { width: 68px; accent-color: var(--emerald); cursor: pointer; }

        /* Всплывающие окна (Таймер и Виджеты) */
        .popover-box {
            position: fixed; top: 106px; right: 18px;
            background: var(--bg-surface); border: 1px solid var(--border-strong);
            border-radius: 14px; padding: 14px; width: 340px; max-width: 94vw;
            box-shadow: 0 16px 40px rgba(0,0,0,0.14); z-index: 220; display: none;
        }
        .popover-head {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border);
            font-size: 13px; font-weight: 700;
        }
        .widget-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .widget-pick-btn {
            border: 1px solid var(--border-strong); border-radius: 9px; padding: 10px 12px;
            background: var(--bg-subtle); color: var(--text-primary);
            font-size: 12px; font-weight: 600; cursor: pointer; text-align: left;
            display: flex; align-items: center; justify-content: space-between; transition: 0.14s;
        }
        .widget-pick-btn:hover {
            background: var(--emerald-soft); border-color: var(--emerald); color: var(--emerald);
        }

        #placement-banner {
            position: fixed; top: 110px; left: 50%; transform: translateX(-50%);
            background: var(--emerald); color: #fff; padding: 7px 16px;
            border-radius: 999px; font-size: 12px; font-weight: 700;
            box-shadow: 0 8px 24px rgba(13, 115, 80, 0.3);
            display: none; align-items: center; gap: 10px; z-index: 180;
        }
        .placement-cancel-btn {
            background: rgba(255,255,255,0.2); border: none; color: #fff;
            padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; cursor: pointer;
        }

        /* Основная рабочая область: Холст слева + Правая колонка с камерами и чатом */
        .class-body {
            flex: 1; display: flex; min-height: 0; position: relative; overflow: hidden;
        }

        #board-viewport {
            flex: 1; height: 100%; overflow: hidden; position: relative;
            cursor: crosshair; touch-action: none;
            background-color: var(--bg-surface);
            background-image: radial-gradient(var(--dot-color) 1.35px, transparent 1.35px);
            background-size: 28px 28px;
        }
        #board-world {
            width: 4200px; height: 3000px; position: absolute; top: 0; left: 0;
            transform-origin: 0 0; will-change: transform; touch-action: none;
        }

        /* Холст маркера (z-index: 25) находится НАД фото (z-index: 15), но ПОД остальными виджетами (z-index: 35) */
        canvas { position: absolute; top: 0; left: 0; z-index: 25; pointer-events: none; }
        #temp-canvas { z-index: 26; }

        /* Правая колонка (Камеры + Звук + Чат) */
        .class-sidebar {
            width: 285px; background: var(--bg-surface); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 12px; gap: 10px;
            flex-shrink: 0; z-index: 100; min-height: 0;
        }
        .class-sidebar.collapsed { display: none; }

        .cams-wrap { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .cam-box {
            width: 100%; height: 132px; background: #18201c; border-radius: 10px;
            overflow: hidden; position: relative; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
        }
        .cam-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .cam-placeholder {
            color: #8c9691; font-size: 12px; font-weight: 600;
            text-align: center; padding: 8px; position: absolute; z-index: 2;
        }
        .cam-tag {
            position: absolute; bottom: 7px; left: 9px; z-index: 3;
            background: rgba(0, 0, 0, 0.58); color: #fff; font-size: 11px; font-weight: 700;
            padding: 2px 8px; border-radius: 6px; pointer-events: none;
        }
        .rtc-status-bar {
            font-size: 11px; font-weight: 600; color: var(--text-secondary);
            text-align: center; padding: 4px 6px; border-radius: 6px;
            background: var(--bg-subtle); border: 1px solid var(--border); cursor: pointer;
        }

        .media-controls-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex-shrink: 0;
        }
        .media-btn {
            height: 32px; border-radius: 7px; border: 1px solid var(--border-strong);
            background: var(--bg-surface); color: var(--text-primary);
            font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.14s;
        }
        .media-btn.lit {
            background: var(--emerald-soft); border-color: var(--emerald);
            color: var(--emerald); font-weight: 700;
        }

        /* Чат урока */
        .chat-box {
            flex: 1; border: 1px solid var(--border); border-radius: 10px;
            background: var(--bg-subtle); display: flex; flex-direction: column; min-height: 0; overflow: hidden;
        }
        .chat-messages {
            flex: 1; padding: 10px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 7px; font-size: 12px;
            user-select: text; -webkit-user-select: text;
        }
        .chat-msg {
            background: var(--bg-surface); border: 1px solid var(--border);
            padding: 7px 10px; border-radius: 8px; line-height: 1.4; word-break: break-word;
        }
        .chat-msg-author { font-size: 11px; font-weight: 700; color: var(--emerald); margin-bottom: 2px; }
        .chat-input-row {
            padding: 8px; background: var(--bg-surface); border-top: 1px solid var(--border);
            display: flex; gap: 6px;
        }
        .chat-input {
            flex: 1; height: 32px; padding: 0 10px; border-radius: 7px;
            border: 1px solid var(--border-strong); background: var(--bg-subtle);
            color: var(--text-primary); font-size: 12px; outline: none;
            user-select: text; -webkit-user-select: text;
        }
        .chat-input:focus { border-color: var(--emerald); }

        /* Текст на доске */
        .board-text-node {
            position: absolute; z-index: 28; min-width: 70px; max-width: 900px;
            padding: 6px 14px 10px 8px; border-radius: 10px;
            border: 1.5px dashed transparent; display: flex; align-items: flex-start; gap: 6px;
        }
        .board-text-node:hover, .board-text-node:focus-within {
            border-color: var(--border-strong); background: rgba(255, 255, 255, 0.88);
        }
        .board-text-drag {
            cursor: move; color: var(--text-muted); font-size: 13px;
            padding: 2px 4px; opacity: 0; touch-action: none;
        }
        .board-text-node:hover .board-text-drag, .board-text-node:focus-within .board-text-drag { opacity: 1; }
        .board-text-content {
            outline: none; user-select: text; -webkit-user-select: text; cursor: text;
            font-weight: 700; line-height: 1.3; white-space: pre-wrap; word-break: break-word; min-width: 45px;
        }
        .board-text-content:empty:before { content: 'Введите текст...'; color: var(--text-muted); font-weight: 400; }
        .board-text-del {
            opacity: 0; width: 18px; height: 18px; border-radius: 5px;
            border: 1px solid var(--danger-border); background: var(--danger-soft);
            color: var(--danger); font-size: 10px; font-weight: 700; cursor: pointer;
        }
        .board-text-node:hover .board-text-del, .board-text-node:focus-within .board-text-del { opacity: 1; }
        .text-resize-handle {
            position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px;
            cursor: nwse-resize; display: flex; align-items: flex-end; justify-content: flex-end;
            color: var(--text-muted); font-size: 10px; opacity: 0; touch-action: none;
        }
        .board-text-node:hover .text-resize-handle, .board-text-node:focus-within .text-resize-handle { opacity: 1; }

        /* Указка */
        #laser-cursor {
            position: absolute; pointer-events: none; z-index: 80;
            display: none; transform: translate(-50%, -50%);
            transition: left 0.05s linear, top 0.05s linear;
        }
        .laser-dot {
            width: 16px; height: 16px; background: #dc2626; border-radius: 50%;
            box-shadow: 0 0 14px #dc2626; border: 2px solid #fff;
        }

        /* Виджеты (z-index: 35 — НАД маркером; photo-widget z-index: 15 — ПОД маркером) */
        .widget {
            position: absolute; background: var(--bg-surface); border-radius: 12px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.08); border: 1px solid var(--border-strong);
            padding: 6px 10px 12px 10px; z-index: 35;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .widget.photo-widget {
            z-index: 15; padding: 4px 6px 6px 6px; min-width: 120px; min-height: 80px;
        }
        .widget.locked-widget .resize-handle { display: none !important; }
        .widget.locked-widget .widget-header { cursor: default; }
        .widget-header {
            display: flex; justify-content: space-between; align-items: center;
            cursor: move; padding: 2px 2px 6px 2px; flex-shrink: 0; gap: 6px; touch-action: none;
        }
        .widget-actions-left, .widget-actions-right { display: flex; align-items: center; gap: 4px; }
        .grip-bar { width: 32px; height: 4px; background: var(--border-strong); border-radius: 8px; margin: 0 auto; }
        .header-icon-btn, .close-btn {
            height: 22px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--border);
            background: var(--bg-subtle); color: var(--text-secondary);
            font-size: 10px; font-weight: 700; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .header-icon-btn.locked-active {
            background: var(--emerald-soft); border-color: var(--emerald); color: var(--emerald);
        }
        .close-btn:hover { background: var(--danger-soft); border-color: var(--danger-border); color: var(--danger); }

        .resize-handle {
            position: absolute; right: 2px; bottom: 2px; width: 20px; height: 20px;
            cursor: nwse-resize; display: flex; align-items: flex-end; justify-content: flex-end;
            color: var(--text-muted); font-size: 11px; padding: 2px; z-index: 30; touch-action: none;
        }

        .video-widget-box { width: 350px; height: 255px; min-width: 230px; min-height: 180px; }
        .upload-video-btn {
            background: var(--emerald-soft); color: var(--emerald); border: 1px solid var(--emerald-border);
            padding: 6px 10px; border-radius: 7px; font-size: 11px; font-weight: 700;
            cursor: pointer; margin-bottom: 6px; width: 100%; text-align: center; display: block;
        }
        .video-widget-box video {
            width: 100%; flex: 1; min-height: 0; border-radius: 7px;
            background: #111815; object-fit: contain;
        }
        .video-unmute-hint {
            position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%);
            background: var(--emerald); color: #fff; border: none;
            padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 700;
            cursor: pointer; z-index: 5; display: none;
        }

        .essay-widget-box { width: 350px; height: 245px; min-width: 230px; min-height: 165px; }
        .essay-widget-box textarea {
            width: 100%; flex: 1; min-height: 0; border: 1px solid var(--border); border-radius: 8px;
            padding: 10px; font-size: 13px; font-weight: 500; line-height: 1.45;
            background: var(--bg-subtle); color: var(--text-primary);
            resize: none; user-select: text; -webkit-user-select: text; outline: none;
        }
        .word-counter { margin-top: 6px; font-size: 11px; font-weight: 700; color: var(--text-secondary); flex-shrink: 0; }

        .photo-widget img {
            width: 100%; flex: 1; min-height: 0; object-fit: fill;
            border-radius: 7px; display: block; pointer-events: none;
        }

        .sticker-widget {
            width: 210px; height: 175px; min-width: 145px; min-height: 115px;
            background: #fef9c3; border: 1px solid #fde047;
        }
        .sticker-widget textarea {
            width: 100%; flex: 1; min-height: 0; resize: none;
            user-select: text; -webkit-user-select: text;
            background: transparent; border: none; color: #111815;
            font-weight: 600; font-size: 14px; line-height: 1.4; outline: none; padding: 4px;
        }
        .sticker-dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.2); }

        .speaking-widget-box { width: 340px; height: 235px; min-width: 265px; min-height: 210px; }
        .speaking-presets { display: flex; gap: 5px; margin-bottom: 8px; flex-shrink: 0; }
        .spk-preset-btn {
            flex: 1; border: 1px solid var(--border-strong); background: var(--bg-subtle);
            color: var(--text-primary); padding: 6px; border-radius: 7px;
            font-size: 11px; font-weight: 600; cursor: pointer;
        }
        .spk-preset-btn.active {
            background: var(--emerald-soft); color: var(--emerald); border-color: var(--emerald); font-weight: 700;
        }
        .speaking-timer-row {
            display: flex; align-items: center; justify-content: space-between;
            background: #111815; color: #fff; padding: 8px 10px;
            border-radius: 8px; margin-bottom: 8px; flex-shrink: 0; gap: 6px;
        }
        .speaking-clock { font-size: 17px; font-weight: 800; color: #34d399; min-width: 52px; font-variant-numeric: tabular-nums; }
        .spk-ctrl-btn {
            border: none; background: var(--emerald); color: #fff; padding: 5px 10px;
            border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .speaking-rec-btn {
            border: none; background: #dc2626; color: #fff; padding: 5px 10px;
            border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .speaking-rec-btn.recording { background: #d97706; }
        .speaking-audio-player { width: 100%; height: 32px; margin-top: auto; flex-shrink: 0; }

        .dict-widget-box { width: 345px; height: 275px; min-width: 260px; min-height: 210px; }
        .dict-search-row { display: flex; gap: 6px; margin-bottom: 8px; flex-shrink: 0; }
        .dict-input {
            flex: 1; padding: 6px 10px; border: 1px solid var(--border-strong);
            background: var(--bg-subtle); color: var(--text-primary);
            border-radius: 7px; font-size: 12px; font-weight: 600; outline: none;
            user-select: text; -webkit-user-select: text;
        }
        .dict-search-btn {
            background: var(--emerald); color: #fff; border: none; padding: 0 12px;
            border-radius: 7px; font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .dict-body {
            flex: 1; overflow-y: auto; background: var(--bg-subtle); border: 1px solid var(--border);
            border-radius: 7px; padding: 8px 10px; font-size: 12px; color: var(--text-primary);
            user-select: text; -webkit-user-select: text; line-height: 1.45;
        }
        .dict-links-row { display: flex; gap: 6px; margin-top: 6px; flex-shrink: 0; }
        .dict-ext-link {
            flex: 1; text-align: center; text-decoration: none; font-size: 10px;
            font-weight: 700; padding: 5px; border-radius: 6px;
            background: var(--bg-subtle); color: var(--text-secondary); border: 1px solid var(--border);
        }

        @media (max-width: 860px) {
            .class-sidebar {
                position: fixed; top: 100px; right: 0; bottom: 0;
                box-shadow: -10px 0 30px rgba(0,0,0,0.15);
            }
            .lesson-title-text { max-width: 150px; }
        }

        /* Права ученика */
        body.role-student .widget-header { cursor: default; }
        body.role-student .widget-header .grip-bar { display: none; }
        body.role-student .widget .close-btn,
        body.role-student .widget .header-icon-btn,
        body.role-student .sticker-dot,
        body.role-student .upload-video-btn { display: none !important; }
        body.role-student .resize-handle,
        body.role-student .text-resize-handle { display: none !important; }
        body.role-student .board-text-drag,
        body.role-student .board-text-del { display: none !important; }
        body.role-student #btn-open-widgets,
        body.role-student #btn-follow,
        body.role-student #btn-clear-board,
        body.role-student #btn-reset-all,
        body.role-student #btn-center-board,
        body.role-student #btn-timer-menu,
        body.role-student #btn-pause-timer { display: none !important; }
    </style>
</head>
<body class="role-teacher">

    <audio id="remote-voice-player" autoplay playsinline></audio>

    <div class="classroom-layout">
        <!-- 1. ВЕРХНЯЯ ПАНЕЛЬ УРОКА -->
        <header class="class-topbar">
            <div class="topbar-left">

                <input type="range" min="2" max="22" value="4" class="size-slider" id="stroke-size-slider" oninput="changeStrokeSize(this.value)" title="Толщина линии">

        <!-- Всплывающее меню виджетов и файлов (Кнопка фото через прямую <label> для iPad Safari) -->

            <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border); display:flex; justify-content:space-between;">

        <!-- Всплывающее меню таймера -->

                <button class="widget-pick-btn" onclick="triggerLessonStart(30)">Запустить на 30 минут</button>
                <button class="btn btn-danger-outline" style="height:30px; font-size:11px; margin-top:4px;" onclick="stopLessonTimer(true); closePopovers();">Сбросить таймер</button>

        <!-- 3. РАБОЧАЯ ОБЛАСТЬ И ПРАВАЯ КОЛОНКА -->
        <div class="class-body">
            <div id="board-viewport">
                <div id="board-world">
                    <div id="dynamic-items"></div>
                    <canvas id="canvas" width="4200" height="3000"></canvas>
                    <canvas id="temp-canvas" width="4200" height="3000"></canvas>
                    <div id="laser-cursor"><div class="laser-dot"></div></div>
                </div>
            </div>

            <aside class="class-sidebar" id="class-sidebar">
                <div class="cams-wrap">
                    <div class="cam-box">
                        <div class="cam-placeholder" id="student-placeholder">Камера ученика</div>
                        <video id="studentVideo" autoplay muted playsinline></video>
                        <span class="cam-tag">Ученик</span>
                    </div>
                    <div class="cam-box">
                        <div class="cam-placeholder" id="teacher-placeholder">Камера преподавателя</div>
                        <video id="teacherVideo" autoplay muted playsinline></video>
                        <span class="cam-tag">Преподаватель</span>

                </div>

                <div class="media-controls-grid">
                    <button class="media-btn" id="btn-mic-toggle" onclick="toggleMic()">Микрофон</button>
                    <button class="media-btn" id="btn-cam-toggle" onclick="toggleCamera()">Камера</button>
                    <button class="media-btn lit" id="btn-sound-toggle" onclick="toggleRemoteSound()">Звук вкл</button>

                <div class="chat-box">
                    <div class="chat-messages" id="chat-messages-list"></div>
                    <div class="chat-input-row">
                        <input type="text" class="chat-input" id="chat-input-field" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                        <button class="btn btn-emerald" style="height:32px; padding:0 10px;" onclick="sendChatMessage()">→</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAmlK0KFtxAWUNdEw8OEK0sZzWgf_KUIyE",
            authDomain: "english-space-13381.firebaseapp.com",
            databaseURL: "https://english-space-13381-default-rtdb.firebaseio.com",
            projectId: "english-space-13381",
            storageBucket: "english-space-13381.firebasestorage.app",
            messagingSenderId: "54553238353",
            appId: "1:54553238353:web:e269ccf594e77f21bad170",
            measurementId: "G-RQ2YW5CYV7"
        };

        if (localStorage.getItem('es_theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }

        let db = null, auth = null, roomRef = null;
        const urlParams = new URLSearchParams(window.location.search);
        const rawRoom = urlParams.get('room') || 'default_room';
        const boardTitleParam = urlParams.get('title') || 'Доска урока';
        document.getElementById('board-title-label').innerText = boardTitleParam;

        const ROOM_ID = rawRoom.replace(/[^a-zA-Z0-9_-]/g, '_');
        const LOCAL_BOARD_KEY = 'es_board_cache_' + ROOM_ID;
        const localChannel = new BroadcastChannel('es_live_' + ROOM_ID);

        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.database();
            roomRef = db.ref('boards/' + ROOM_ID);
        } catch (e) {}

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const tempCanvas = document.getElementById('temp-canvas');
        const tempCtx = tempCanvas.getContext('2d');

        const boardWorld = document.getElementById('board-world');
        const viewport = document.getElementById('board-viewport');
        const laserCursor = document.getElementById('laser-cursor');
        const widgetsModal = document.getElementById('widgets-modal');
        const dynamicItems = document.getElementById('dynamic-items');
        const lessonTimePopover = document.getElementById('lesson-time-popover');
        const placementBanner = document.getElementById('placement-banner');
        const remoteVoicePlayer = document.getElementById('remote-voice-player');
        const chatMessagesList = document.getElementById('chat-messages-list');

        const CENTER_X = -1400;
        const CENTER_Y = -950;

        function detectInitialRole() {
            const paramRole = urlParams.get('role');
            if (paramRole === 'teacher' || paramRole === 'student') return paramRole;
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith('es_role_')) {
                    const r = localStorage.getItem(k);
                    if (r === 'teacher' || r === 'student') return r;
                }
            }
            return 'teacher';
        }

        let role = detectInitialRole();
        let myClientId = 'cl_' + Math.random().toString(36).slice(2, 9);
        let tool = 'marker';
        let lastDrawTool = 'marker';
        let currentColor = '#0d7350';
        let baseStrokeSize = 4;

        let drawing = false;
        let panning = false;
        let followMode = true;
        let boardX = CENTER_X, boardY = CENTER_Y;
        let boardScale = 1;

        let targetFollowX = CENTER_X;
        let targetFollowY = CENTER_Y;
        let targetFollowScale = 1;

        let startPanX = 0, startPanY = 0;
        let currentStrokePoints = [];
        let strokeBounds = { minX: 0, minY: 0, maxX: 0, maxY: 0 };

        let photoZIndex = 15;
        let topZIndex = 35;

        let pendingWidgetType = null;
        let strokeHistory = [];
        let actionHistory = [];
        let redoActionStack = [];
        let chatHistory = [];

        let timerInterval = null;
        let remainingSeconds = 0;
        let timerPaused = false;
        let lastMoveSentTime = 0;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        tempCtx.lineCap = 'round';
        tempCtx.lineJoin = 'round';

        applyVerifiedRole(role);
        applyBoardTransform();

        function startSmoothFollowLoop() {
            function step() {
                if (role === 'student' && followMode) {
                    const dx = targetFollowX - boardX;
                    const dy = targetFollowY - boardY;
                    const ds = targetFollowScale - boardScale;
                    if (Math.abs(dx) > 0.4 || Math.abs(dy) > 0.4 || Math.abs(ds) > 0.002) {
                        boardX += dx * 0.22;
                        boardY += dy * 0.22;
                        boardScale += ds * 0.22;
                        updateZoomUI();
                        applyBoardTransform();
                    }
                }
                requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }
        startSmoothFollowLoop();

        function applyVerifiedRole(verifiedRole) {
            role = (verifiedRole === 'student') ? 'student' : 'teacher';
            document.body.className = (localStorage.getItem('es_theme') === 'dark' ? 'dark-theme ' : '') + 'role-' + role;
            updateStudentPanLock();
            updateLaserVisibility();
        }

        function toggleSidebarPanel() {
            document.getElementById('class-sidebar').classList.toggle('collapsed');
            setTimeout(applyBoardTransform, 50);
        }

        function exitToCabinet() {
            saveBoardState();
            cleanupWebRTC();
            if (window.parent && window.parent !== window && typeof window.parent.closeBoardRoom === 'function') {
                window.parent.closeBoardRoom();
            } else {
                window.location.href = 'index.html';
            }
        }

        function broadcastEvent(payload) {
            const msg = { ...payload, sender: myClientId, ts: Date.now() };
            try { localChannel.postMessage(msg); } catch (e) {}
            if (roomRef) {
                try { roomRef.child('events').push(msg).catch(() => {}); } catch (e) {}
            }
        }

        localChannel.onmessage = (ev) => {
            if (ev.data && ev.data.sender !== myClientId) {
                handleRemoteEvent(ev.data);
            }
        };

        function restoreSnapshotData(val) {
            if (!val) return;
            if (val.strokeHistory) {
                strokeHistory = val.strokeHistory;
                redrawAllStrokes();
            }
            if (val.chatHistory && Array.isArray(val.chatHistory)) {
                chatHistory = val.chatHistory;
                renderChatMessages();
            }
            if (val.items && Array.isArray(val.items)) {
                dynamicItems.innerHTML = '';
                val.items.forEach(item => {
                    if (item.type === 'video') createVideoWidget(item, false, false);
                    else if (item.type === 'essay') createEssayWidget(item, false, false);
                    else if (item.type === 'photo') spawnPhotoWidget(item, false, false);
                    else if (item.type === 'sticker') createSticker(item, false, false);
                    else if (item.type === 'speaking') createSpeakingWidget(item, false, false);
                    else if (item.type === 'dict') createDictWidget(item, false, false);
                    else if (item.type === 'text') createTextNode(item, false, false);
                });
            }
        }

        function initRealtimeSync() {
            try {
                const localRaw = localStorage.getItem(LOCAL_BOARD_KEY);
                if (localRaw) restoreSnapshotData(JSON.parse(localRaw));
            } catch (e) {}

            if (!roomRef) return;
            try {
                roomRef.child('snapshot').once('value', (snap) => {
                    const val = snap.val();
                    if (val) restoreSnapshotData(val);
                });

                roomRef.child('teacherMove').on('value', (snap) => {
                    const data = snap.val();
                    if (!data || data.sender === myClientId) return;
                    handleTeacherMoveData(data);
                });

                let initialEventsSkipped = false;
                roomRef.child('events').limitToLast(1).on('child_added', (snap) => {
                    if (!initialEventsSkipped) { initialEventsSkipped = true; return; }
                    const data = snap.val();
                    if (!data || data.sender === myClientId) return;
                    handleRemoteEvent(data);
                });
            } catch (e) {}
        }

        // Чат урока
        function sendChatMessage() {
            const input = document.getElementById('chat-input-field');
            const text = input.value.trim();
            if (!text) return;
            const author = role === 'teacher' ? 'Преподаватель' : 'Ученик';
            const msgObj = { author, text, ts: Date.now() };
            chatHistory.push(msgObj);
            if (chatHistory.length > 60) chatHistory.shift();
            input.value = '';
            renderChatMessages();
            saveBoardState();
            broadcastEvent({ type: 'chat_msg', msg: msgObj });
        }

        function renderChatMessages() {
            chatMessagesList.innerHTML = chatHistory.map(m => `
                <div class="chat-msg">
                    <div class="chat-msg-author">${m.author}</div>
                    <div>${m.text.replace(/</g, '&lt;')}</div>
                </div>
            `).join('');
            chatMessagesList.scrollTop = chatMessagesList.scrollHeight;
        }

        function sendTeacherViewportSync(worldX, worldY) {
            if (role !== 'teacher') return;
            const pointerActive = (tool === 'pointer');
            const vw = viewport.clientWidth || window.innerWidth;
            const vh = viewport.clientHeight || window.innerHeight;
            const movePayload = {
                type: 'teacher_move_local',
                sender: myClientId,
                worldX: worldX !== undefined ? worldX : Math.round((vw / 2 - boardX) / boardScale),
                worldY: worldY !== undefined ? worldY : Math.round((vh / 2 - boardY) / boardScale),
                boardX, boardY, boardScale,
                vw, vh, followMode, pointerActive
            };
            try { localChannel.postMessage(movePayload); } catch (err) {}
            if (roomRef) {
                try { roomRef.child('teacherMove').set(movePayload).catch(() => {}); } catch (err) {}
            }
        }

        function handleTeacherMoveData(data) {
            followMode = data.followMode;
            updateStudentPanLock();
            laserCursor.style.display = data.pointerActive ? 'block' : 'none';
            if (data.pointerActive && data.worldX !== undefined) {
                laserCursor.style.left = data.worldX + 'px';
                laserCursor.style.top = data.worldY + 'px';
            }

            if (role === 'student' && followMode) {
                const tScale = data.boardScale || 1;
                targetFollowScale = tScale;
                const myVw = viewport.clientWidth || window.innerWidth;
                const myVh = viewport.clientHeight || window.innerHeight;
                const tVw = data.vw || myVw;
                const tVh = data.vh || myVh;
                const centerWorldX = (tVw / 2 - data.boardX) / tScale;
                const centerWorldY = (tVh / 2 - data.boardY) / tScale;
                const minX = Math.min(0, myVw - canvas.width * tScale);
                const minY = Math.min(0, myVh - canvas.height * tScale);

                targetFollowX = Math.min(0, Math.max(minX, myVw / 2 - centerWorldX * tScale));
                targetFollowY = Math.min(0, Math.max(minY, myVh / 2 - centerWorldY * tScale));
            }
        }

        const pencilPatternCache = {};
        function getPencilPattern(colorHex) {
            if (pencilPatternCache[colorHex]) return pencilPatternCache[colorHex];
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 24; pCanvas.height = 24;
            const pCtx = pCanvas.getContext('2d');
            pCtx.fillStyle = colorHex;
            for (let x = 0; x < 24; x++) {
                for (let y = 0; y < 24; y++) {
                    const rnd = Math.random();
                    if (rnd > 0.32) {
                        pCtx.globalAlpha = rnd * 0.85;
                        pCtx.fillRect(x, y, 1.3, 1.3);
                    }
                }
            }
            const pattern = ctx.createPattern(pCanvas, 'repeat');
            pencilPatternCache[colorHex] = pattern;
            return pattern;
        }

        function bringToFront(el) {
            if (el.classList.contains('locked-widget')) return;
            if (el.classList.contains('photo-widget')) {
                photoZIndex = photoZIndex >= 22 ? 15 : photoZIndex + 1;
                el.style.zIndex = photoZIndex;
            } else {
                topZIndex = topZIndex >= 48 ? 36 : topZIndex + 1;
                el.style.zIndex = topZIndex;
            }
        }

        function startWidgetPlacement(type, label) {
            if (role === 'student') return;
            widgetsModal.style.display = 'none';
            pendingWidgetType = type;
            document.getElementById('placement-text').innerText = `Нажмите на доску: ${label}`;
            placementBanner.style.display = 'flex';
            viewport.style.cursor = 'copy';
        }

        function cancelPendingPlacement() {
            pendingWidgetType = null;
            placementBanner.style.display = 'none';
            setTool(tool);
        }

        function recordAction(action) {
            actionHistory.push(action);
            redoActionStack = [];
            saveBoardState();
        }

        function undoAction() {
            if (actionHistory.length === 0) return;
            const act = actionHistory.pop();
            redoActionStack.push(act);

            if (act.kind === 'stroke') {
                strokeHistory.pop();
                redrawAllStrokes();
                broadcastEvent({ type: 'strokes_sync', strokeHistory });
            } else if (act.kind === 'add_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    const v = el.querySelector('video');
                    if (v) v.pause();
                    el.style.display = 'none';
                    broadcastEvent({ type: 'item_display', id: act.id, display: 'none' });
                }
            } else if (act.kind === 'remove_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.display = act.prevDisplay || 'flex';
                    broadcastEvent({ type: 'item_display', id: act.id, display: el.style.display });
                }
            } else if (act.kind === 'move_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.left = act.fromLeft + 'px';
                    el.style.top = act.fromTop + 'px';
                    broadcastEvent({ type: 'widget_move', id: act.id, left: act.fromLeft, top: act.fromTop });
                }
            } else if (act.kind === 'resize_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.width = act.fromW + 'px';
                    el.style.height = act.fromH + 'px';
                    broadcastEvent({ type: 'widget_resize', id: act.id, width: act.fromW, height: act.fromH });
                }
            }
            saveBoardState();
        }

        function redoAction() {
            if (redoActionStack.length === 0) return;
            const act = redoActionStack.pop();
            actionHistory.push(act);

            if (act.kind === 'stroke') {
                strokeHistory.push(act.stroke);
                redrawAllStrokes();
                broadcastEvent({ type: 'strokes_sync', strokeHistory });
            } else if (act.kind === 'add_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.display = act.display || 'flex';
                    broadcastEvent({ type: 'item_display', id: act.id, display: el.style.display });
                }
            } else if (act.kind === 'remove_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.display = 'none';
                    broadcastEvent({ type: 'item_display', id: act.id, display: 'none' });
                }
            } else if (act.kind === 'move_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.left = act.toLeft + 'px';
                    el.style.top = act.toTop + 'px';
                    broadcastEvent({ type: 'widget_move', id: act.id, left: act.toLeft, top: act.toTop });
                }
            } else if (act.kind === 'resize_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.width = act.toW + 'px';
                    el.style.height = act.toH + 'px';
                    broadcastEvent({ type: 'widget_resize', id: act.id, width: act.toW, height: act.toH });
                }
            }
            saveBoardState();
        }

        function redrawAllStrokes() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokeHistory.forEach(s => {
                renderSmoothPath(ctx, s.points, s.color, s.strokeTool, s.size);
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && pendingWidgetType) { cancelPendingPlacement(); return; }

        function changeZoom(delta, centerClientX, centerClientY) {
            if (role === 'student' && followMode) return;
            const oldScale = boardScale;
            boardScale = Math.min(2.4, Math.max(0.45, +(boardScale + delta).toFixed(2)));
            if (oldScale === boardScale) return;

            const vw = viewport.clientWidth || window.innerWidth;
            const vh = viewport.clientHeight || window.innerHeight;
            const cx = centerClientX !== undefined ? centerClientX : vw / 2;
            const cy = centerClientY !== undefined ? centerClientY : vh / 2;
            const worldCenterX = (cx - boardX) / oldScale;
            const worldCenterY = (cy - boardY) / oldScale;

            boardX = cx - worldCenterX * boardScale;
            boardY = cy - worldCenterY * boardScale;

            updateZoomUI(); applyBoardTransform();
            if (role === 'teacher') sendTeacherViewportSync();
        }

        function resetZoom() {
            if (role === 'student' && followMode) return;
            changeZoom(1 - boardScale);

        viewport.addEventListener('wheel', (e) => {
            if (e.target.closest('.widget') || e.target.closest('.board-text-node')) return;
            e.preventDefault();
            const rect = viewport.getBoundingClientRect();
            changeZoom(e.deltaY < 0 ? 0.1 : -0.1, e.clientX - rect.left, e.clientY - rect.top);
        }, { passive: false });

        let lastPinchDist = null;
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                drawing = false; panning = false;
                lastPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && lastPinchDist !== null) {
                e.preventDefault();
                const rect = viewport.getBoundingClientRect();
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const diff = dist - lastPinchDist;
                if (Math.abs(diff) > 6) {
                    const cx = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
                    const cy = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
                    changeZoom(diff > 0 ? 0.04 : -0.04, cx, cy);
                    lastPinchDist = dist;
                }
            }
        }, { passive: false });

        viewport.addEventListener('touchend', () => { lastPinchDist = null; });

        function screenToWorld(clientX, clientY) {
            const rect = viewport.getBoundingClientRect();
            return {
                x: (clientX - rect.left - boardX) / boardScale,
                y: (clientY - rect.top - boardY) / boardScale
            };
        }

        function makeWidgetInteractive(widget, aspectRatio) {
            const header = widget.querySelector('.widget-header');
            const resizeHandle = widget.querySelector('.resize-handle');
            let isDragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
            let isResizing = false, origW = 0, origH = 0;

            widget.addEventListener('pointerdown', () => bringToFront(widget));

            if (header) {
                header.addEventListener('pointerdown', (e) => {
                    if (role === 'student' || widget.classList.contains('locked-widget')) return;
                    if (e.target.closest('button') || e.target.closest('label') || e.target.closest('.sticker-dot')) return;
                    e.stopPropagation(); bringToFront(widget);
                    isDragging = true; startX = e.clientX; startY = e.clientY; origLeft = widget.offsetLeft; origTop = widget.offsetTop;
                });
            }

            if (resizeHandle) {
                resizeHandle.addEventListener('pointerdown', (e) => {
                    if (role === 'student' || widget.classList.contains('locked-widget')) return;
                    e.stopPropagation(); bringToFront(widget);
                    isResizing = true; startX = e.clientX; startY = e.clientY; origW = widget.offsetWidth; origH = widget.offsetHeight;
                });
            }

            window.addEventListener('pointermove', (e) => {
                if (isDragging) {
                    widget.style.left = Math.round(origLeft + (e.clientX - startX) / boardScale) + 'px';
                    widget.style.top = Math.round(origTop + (e.clientY - startY) / boardScale) + 'px';
                    broadcastEvent({ type: 'widget_move', id: widget.id, left: widget.offsetLeft, top: widget.offsetTop });
                } else if (isResizing) {
                    const minW = parseInt(widget.dataset.minW || 180, 10);
                    const minH = parseInt(widget.dataset.minH || 130, 10);
                    const newW = Math.max(minW, Math.round(origW + (e.clientX - startX) / boardScale));
                    const newH = aspectRatio ? Math.max(minH, Math.round((newW - 12) / aspectRatio) + 32) : Math.max(minH, Math.round(origH + (e.clientY - startY) / boardScale));
                    widget.style.width = newW + 'px'; widget.style.height = newH + 'px';
                    broadcastEvent({ type: 'widget_resize', id: widget.id, width: newW, height: newH });
                }
            });

            window.addEventListener('pointerup', () => {
                if (isDragging && (widget.offsetLeft !== origLeft || widget.offsetTop !== origTop)) {
                    recordAction({ kind: 'move_item', id: widget.id, fromLeft: origLeft, fromTop: origTop, toLeft: widget.offsetLeft, toTop: widget.offsetTop });
                } else if (isResizing && (widget.offsetWidth !== origW || widget.offsetHeight !== origH)) {
                    recordAction({ kind: 'resize_item', id: widget.id, fromW: origW, fromH: origH, toW: widget.offsetWidth, toH: widget.offsetHeight });
                }
                isDragging = false; isResizing = false;
            });
        }

        function loadLocalMediaFor(event, id) {
            const file = event.target.files[0];
            const v = document.querySelector(`#${id} video`);
            const btnLabel = document.getElementById(`vid-btn-label-${id}`);
            if (!file || !v) return;

            v.src = URL.createObjectURL(file); v.muted = false;
            if (file.size > 45 * 1024 * 1024) { alert('Файл больше 45 МБ. Выберите ролик покороче.'); return; }
            if (btnLabel) btnLabel.innerText = 'Загрузка для ученика: 0%';

            const reader = new FileReader();
            reader.onload = async (e) => {
                const fullDataUrl = e.target.result;
                if (!roomRef) return;
                try {
                    const chunkSize = 350000;
                    const totalChunks = Math.ceil(fullDataUrl.length / chunkSize);
                    const videoNodeRef = roomRef.child('videoFiles/' + id);
                    await videoNodeRef.remove();
                    for (let i = 0; i < totalChunks; i++) {
                        await videoNodeRef.child('chunks/' + i).set(fullDataUrl.slice(i * chunkSize, (i + 1) * chunkSize));
                        if (btnLabel) btnLabel.innerText = `Загрузка: ${Math.round(((i + 1) / totalChunks) * 100)}%`;
                    }
                    await videoNodeRef.child('meta').set({ totalChunks, name: file.name, updatedAt: Date.now() });
                    if (btnLabel) btnLabel.innerText = `Загружено (${file.name.slice(0, 18)})`;
                    broadcastEvent({ type: 'video_chunks_ready', id });
                } catch (err) { if (btnLabel) btnLabel.innerText = 'Ошибка загрузки'; }
            };
            reader.readAsDataURL(file);
        }

        function base64DataUrlToBlob(dataUrl) {
            const parts = dataUrl.split(',');
            const rawMime = (parts[0].match(/:(.*?);/) || [])[1] || 'video/mp4';
            const mime = rawMime === 'video/quicktime' ? 'video/mp4' : rawMime;
            const bstr = atob(parts[1]); let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) u8arr[n] = bstr.charCodeAt(n);
            return new Blob([u8arr], { type: mime });
        }

        function loadSyncedVideoFromFirebase(id) {
            if (!roomRef) return;
            roomRef.child(`videoFiles/${id}/meta`).on('value', async (metaSnap) => {
                const meta = metaSnap.val();
                if (!meta || !meta.totalChunks) return;
                const btnLabel = document.getElementById(`vid-btn-label-${id}`);
                if (btnLabel && role === 'teacher') btnLabel.innerText = `Готово (${(meta.name || 'Видео').slice(0, 18)})`;
                try {
                    const chunksSnap = await roomRef.child(`videoFiles/${id}/chunks`).once('value');
                    const chunksVal = chunksSnap.val();
                    if (!chunksVal) return;
                    let fullDataUrl = '';
                    for (let i = 0; i < meta.totalChunks; i++) { if (chunksVal[i]) fullDataUrl += chunksVal[i]; }
                    if (!fullDataUrl) return;
                    const v = document.querySelector(`#${id} video`);
                    if (v) { v.src = URL.createObjectURL(base64DataUrlToBlob(fullDataUrl)); v.load(); }
                } catch (e) {}
            });
        }

        function processImageFile(file, targetX, targetY) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const offCanvas = document.createElement('canvas');
                    const scale = img.width > 900 ? 900 / img.width : 1;
                    offCanvas.width = Math.round(img.width * scale);
                    offCanvas.height = Math.round(img.height * scale);
                    offCanvas.getContext('2d').drawImage(img, 0, 0, offCanvas.width, offCanvas.height);
                    const aspect = offCanvas.width / offCanvas.height;
                    const initW = Math.min(340, window.innerWidth - 60);
                    spawnPhotoWidget({
                        id: 'photo-' + Date.now(), left: Math.round(targetX), top: Math.round(targetY),
                        width: initW, height: Math.round((initW - 12) / aspect) + 32, aspect, src: offCanvas.toDataURL('image/jpeg', 0.82)
                    }, true, true);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function spawnPhotoWidget(data, broadcast, recordInHistory = true) {
            if (document.getElementById(data.id)) return;
            const div = document.createElement('div');
            div.className = 'widget photo-widget'; div.id = data.id; div.dataset.type = 'photo'; div.dataset.aspect = data.aspect || 1;

        async function toggleSpeakingRecord(id) {
            const btn = document.getElementById(`spk-rec-${id}`);
            const audioEl = document.getElementById(`spk-audio-${id}`);
            if (!btn || !audioEl) return;
            if (speakingRecorders[id] && speakingRecorders[id].state === 'recording') {
                speakingRecorders[id].stop();
                btn.classList.remove('recording');
                btn.innerText = 'Запись';
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                speakingRecorders[id] = recorder;
                recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        audioEl.src = reader.result;
                        broadcastEvent({ type: 'speaking_audio', id, src: reader.result });
                    };
                    reader.readAsDataURL(blob);
                };
                recorder.start();
                btn.classList.add('recording');
                btn.innerText = 'Стоп';
            } catch (err) { alert('Разрешите доступ к микрофону.'); }
        }

        async function lookupDictionary(id, broadcast, wordOverride) {
            const inputEl = document.getElementById(`dict-in-${id}`); const bodyEl = document.getElementById(`dict-body-${id}`);
            const camLink = document.getElementById(`cam-link-${id}`); const oxfLink = document.getElementById(`oxf-link-${id}`);
            if (!inputEl || !bodyEl) return;
            const word = (wordOverride || inputEl.value).trim().toLowerCase();
            if (!word) return;
            inputEl.value = word;
            if (camLink) camLink.href = `https://dictionary.cambridge.org/dictionary/english-russian/${encodeURIComponent(word)}`;
            if (oxfLink) oxfLink.href = `https://www.oxfordlearnersdictionaries.com/definition/english/${encodeURIComponent(word)}`;
            bodyEl.innerHTML = 'Поиск...';
            if (broadcast) broadcastEvent({ type: 'dict_lookup', id, word });
            try {
                const [oxRes, trRes] = await Promise.allSettled([
                    fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`).then(r => r.json()),
                    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ru`).then(r => r.json())
                ]);
                const ruWord = (trRes.status === 'fulfilled' && trRes.value?.responseData?.translatedText) ? trRes.value.responseData.translatedText : '';
                if (oxRes.status === 'fulfilled' && Array.isArray(oxRes.value) && oxRes.value.length > 0) {
                    const entry = oxRes.value[0];
                    const phonetic = entry.phonetic || (entry.phonetics?.find(p => p.text)?.text) || '';
                    bodyEl.innerHTML = `<div style="margin-bottom:6px;"><b>${entry.word}</b> <span style="color:var(--emerald);">${phonetic}</span></div>` +
                        (ruWord ? `<div style="background:var(--emerald-soft); color:var(--emerald); padding:4px 8px; border-radius:6px; font-weight:700; margin-bottom:6px;">Перевод: ${ruWord}</div>` : '') +
                        `<div>${entry.meanings[0]?.definitions[0]?.definition || ''}</div>`;
                } else if (ruWord) {
                    bodyEl.innerHTML = `<b>${word}</b> — ${ruWord}`;
                } else { bodyEl.innerHTML = 'Слово не найдено.'; }
            } catch (e) { bodyEl.innerHTML = 'Ошибка соединения.'; }
        }

        function applyBoardTransform() {
            const vw = viewport.clientWidth || window.innerWidth;
            const vh = viewport.clientHeight || window.innerHeight;
            const minX = Math.min(0, vw - canvas.width * boardScale);
            const minY = Math.min(0, vh - canvas.height * boardScale);
            boardX = Math.min(0, Math.max(minX, boardX));
            boardY = Math.min(0, Math.max(minY, boardY));
            boardWorld.style.transform = `translate3d(${boardX}px, ${boardY}px, 0) scale(${boardScale})`;
            const step = +(28 * boardScale).toFixed(2);
            viewport.style.backgroundSize = `${step}px ${step}px`;
            viewport.style.backgroundPosition = `${boardX}px ${boardY}px`;
        }

        function getToolWidth(strokeTool, size) {
            if (strokeTool === 'eraser') return size * 5;
            if (strokeTool === 'pencil') return Math.max(2, size * 0.85);
            if (strokeTool === 'highlighter') return size * 4.5;
            return size;
        }

        function renderSmoothPath(targetCtx, points, color, strokeTool, size) {
            if (!points || points.length === 0) return;
            targetCtx.save(); targetCtx.beginPath();
            targetCtx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) targetCtx.lineTo(points[i].x, points[i].y);
            if (points.length === 1) targetCtx.lineTo(points[0].x + 0.1, points[0].y + 0.1);
            targetCtx.lineWidth = getToolWidth(strokeTool, size);
            if (strokeTool === 'eraser') targetCtx.globalCompositeOperation = 'destination-out';
            else if (strokeTool === 'highlighter') { targetCtx.globalCompositeOperation = 'source-over'; targetCtx.strokeStyle = color; targetCtx.globalAlpha = 0.28; }
            else if (strokeTool === 'pencil') { targetCtx.globalCompositeOperation = 'source-over'; targetCtx.strokeStyle = getPencilPattern(color); targetCtx.globalAlpha = 0.9; }
            else { targetCtx.globalCompositeOperation = 'source-over'; targetCtx.strokeStyle = color; }
            targetCtx.stroke(); targetCtx.restore();
        }

        function clearTempBounds(bounds, pad) {
            tempCtx.clearRect(Math.max(0, bounds.minX - pad), Math.max(0, bounds.minY - pad), (bounds.maxX - bounds.minX) + pad * 2, (bounds.maxY - bounds.minY) + pad * 2);
        }

        viewport.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.resize-handle') || e.target.closest('.text-resize-handle') || e.target.closest('.widget-header') || e.target.closest('.board-text-node')) return;

            if (pendingWidgetType && role === 'teacher') {
                const pt = screenToWorld(e.clientX, e.clientY);
                const wType = pendingWidgetType; cancelPendingPlacement();
                if (wType === 'video') createVideoWidget({ id: 'video-' + Date.now(), left: Math.round(pt.x), top: Math.round(pt.y), width: 350, height: 255 }, true, true);
                else if (wType === 'essay') createEssayWidget({ id: 'essay-' + Date.now(), left: Math.round(pt.x), top: Math.round(pt.y), width: 350, height: 245, text: '' }, true, true);
                else if (wType === 'sticker') createSticker({ id: 'sticker-' + Date.now(), left: Math.round(pt.x), top: Math.round(pt.y), width: 210, height: 175, theme: 'yellow', text: '' }, true, true);
                else if (wType === 'speaking') createSpeakingWidget({ id: 'speaking-' + Date.now(), left: Math.round(pt.x), top: Math.round(pt.y), width: 340, height: 235 }, true, true);
                else if (wType === 'dict') createDictWidget({ id: 'dict-' + Date.now(), left: Math.round(pt.x), top: Math.round(pt.y), width: 345, height: 275 }, true, true);
                return;
            }

            if (e.target.closest('.widget') && !e.target.closest('.photo-widget')) return;

            if (tool === 'pan') {
                if (role === 'student' && followMode) return;
                panning = true; startPanX = e.clientX - boardX; startPanY = e.clientY - boardY;
                viewport.style.cursor = 'grabbing';
            } else if (tool === 'pointer') {
                const pt = screenToWorld(e.clientX, e.clientY);
                laserCursor.style.display = 'block'; laserCursor.style.left = pt.x + 'px'; laserCursor.style.top = pt.y + 'px';
            } else if (tool === 'text') {
                const pt = screenToWorld(e.clientX, e.clientY);
                createTextNode({ id: 'text-' + Date.now(), left: Math.round(pt.x), top: Math.round(pt.y - 14), color: currentColor, fontSize: Math.max(20, Math.min(54, 14 + baseStrokeSize * 2)), text: '' }, true, true);
            } else {
                drawing = true;
                const pt = screenToWorld(e.clientX, e.clientY);
                currentStrokePoints = [pt];
                strokeBounds = { minX: pt.x, minY: pt.y, maxX: pt.x, maxY: pt.y };
            }
        });

        viewport.addEventListener('pointermove', (e) => {
            const pt = screenToWorld(e.clientX, e.clientY);
            const worldX = Math.round(pt.x); const worldY = Math.round(pt.y);

            if (panning) {
                boardX = e.clientX - startPanX; boardY = e.clientY - startPanY; applyBoardTransform();
            } else if (drawing && tool !== 'pointer' && tool !== 'pan' && tool !== 'text') {
                currentStrokePoints.push({ x: worldX, y: worldY });
                const pad = getToolWidth(tool, baseStrokeSize) + 10;
                if (tool === 'highlighter') {
                    clearTempBounds(strokeBounds, pad);
                    strokeBounds.minX = Math.min(strokeBounds.minX, worldX); strokeBounds.minY = Math.min(strokeBounds.minY, worldY);
                    strokeBounds.maxX = Math.max(strokeBounds.maxX, worldX); strokeBounds.maxY = Math.max(strokeBounds.maxY, worldY);
                    renderSmoothPath(tempCtx, currentStrokePoints, currentColor, tool, baseStrokeSize);
                } else {
                    const len = currentStrokePoints.length;
                    renderSmoothPath(ctx, [currentStrokePoints[len - 2], currentStrokePoints[len - 1]], currentColor, tool, baseStrokeSize);
                    broadcastEvent({ type: 'draw_seg', p0: currentStrokePoints[len - 2], p1: currentStrokePoints[len - 1], color: currentColor, strokeTool: tool, size: baseStrokeSize });
                }
            }

            if (role === 'teacher') {
                const pointerActive = (tool === 'pointer');
                laserCursor.style.display = pointerActive ? 'block' : 'none';
                if (pointerActive) { laserCursor.style.left = worldX + 'px'; laserCursor.style.top = worldY + 'px'; }
                if (Date.now() - lastMoveSentTime > 40) { lastMoveSentTime = Date.now(); sendTeacherViewportSync(worldX, worldY); }
            }
        });

        window.addEventListener('pointerup', () => {
            if (drawing && currentStrokePoints.length > 0 && tool !== 'pointer' && tool !== 'pan' && tool !== 'text') {
                if (tool === 'highlighter') clearTempBounds(strokeBounds, getToolWidth(tool, baseStrokeSize) + 15), renderSmoothPath(ctx, currentStrokePoints, currentColor, tool, baseStrokeSize);
                const finishedStroke = { points: currentStrokePoints, color: currentColor, strokeTool: tool, size: baseStrokeSize };
                strokeHistory.push(finishedStroke);
                recordAction({ kind: 'stroke', stroke: finishedStroke });
                broadcastEvent({ type: 'draw_commit', stroke: finishedStroke });
            }
            drawing = false; panning = false; currentStrokePoints = [];
            if (tool === 'pan' && !pendingWidgetType) viewport.style.cursor = 'grab';
        });

        function clearBoard(broadcast) {
            if (role === 'student' && broadcast) return;
            strokeHistory = []; ctx.clearRect(0, 0, canvas.width, canvas.height); tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
