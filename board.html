        function recordAction(action) {
            actionHistory.push(action);
            redoActionStack = [];
            saveBoardState();
        }

        function undoAction() {
            if (actionHistory.length === 0) return;
            const act = actionHistory.pop();
            redoActionStack.push(act);

            if (act.kind === 'stroke') {
                const sId = act.stroke.id;
                if (sId) deletedStrokeIds.add(sId);
                strokeHistory = strokeHistory.filter(s => s.id !== sId);
                redrawAllStrokes();
                broadcastEvent({ type: 'erase_stroke_id', strokeId: sId });
            } else if (act.kind === 'erase_stroke') {
                const sId = act.stroke.id;
                if (sId) deletedStrokeIds.delete(sId);
                strokeHistory.splice(act.index, 0, act.stroke);
                redrawAllStrokes();
                broadcastEvent({ type: 'restore_stroke', stroke: act.stroke, index: act.index });
            } else if (act.kind === 'add_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    const v = el.querySelector('video');
                    if (v) v.pause();
                    el.style.display = 'none';
                    broadcastEvent({ type: 'item_display', id: act.id, display: 'none' });
                }
            } else if (act.kind === 'remove_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.display = act.prevDisplay || 'flex';
                    broadcastEvent({ type: 'item_display', id: act.id, display: el.style.display });
                }
            } else if (act.kind === 'move_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.left = act.fromLeft + 'px';
                    el.style.top = act.fromTop + 'px';
                    broadcastEvent({ type: 'widget_move', id: act.id, left: act.fromLeft, top: act.fromTop });
                }
            } else if (act.kind === 'resize_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.width = act.fromW + 'px';
                    el.style.height = act.fromH + 'px';
                    broadcastEvent({ type: 'widget_resize', id: act.id, width: act.fromW, height: act.fromH });
                }
            }
            saveBoardState();
        }

        function redoAction() {
            if (redoActionStack.length === 0) return;
            const act = redoActionStack.pop();
            actionHistory.push(act);

            if (act.kind === 'stroke') {
                const sId = act.stroke.id;
                if (sId) deletedStrokeIds.delete(sId);
                strokeHistory.push(act.stroke);
                redrawAllStrokes();
                broadcastEvent({ type: 'restore_stroke', stroke: act.stroke, index: strokeHistory.length - 1 });
            } else if (act.kind === 'erase_stroke') {
                const sId = act.stroke.id;
                if (sId) deletedStrokeIds.add(sId);
                strokeHistory = strokeHistory.filter(s => s.id !== sId);
                redrawAllStrokes();
                broadcastEvent({ type: 'erase_stroke_id', strokeId: sId });
            } else if (act.kind === 'add_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.display = act.display || 'flex';
                    broadcastEvent({ type: 'item_display', id: act.id, display: el.style.display });
                }
            } else if (act.kind === 'remove_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.display = 'none';
                    broadcastEvent({ type: 'item_display', id: act.id, display: 'none' });
                }
            } else if (act.kind === 'move_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.left = act.toLeft + 'px';
                    el.style.top = act.toTop + 'px';
                    broadcastEvent({ type: 'widget_move', id: act.id, left: act.toLeft, top: act.toTop });
                }
            } else if (act.kind === 'resize_item') {
                const el = document.getElementById(act.id);
                if (el) {
                    el.style.width = act.toW + 'px';
                    el.style.height = act.toH + 'px';
                    broadcastEvent({ type: 'widget_resize', id: act.id, width: act.toW, height: act.toH });
                }
            }
            saveBoardState();
        }

        function redrawAllStrokes() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokeHistory.forEach(s => {
                if (s && (!s.id || !deletedStrokeIds.has(s.id))) {
                    renderSmoothPath(ctx, s.points, s.color, s.strokeTool, s.size);
                }
            });
        }

        function distToSegmentSquared(p, v, w) {
            const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
            if (l2 === 0) return (p.x - v.x) ** 2 + (p.y - v.y) ** 2;
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            const projX = v.x + t * (w.x - v.x);
            const projY = v.y + t * (w.y - v.y);
            return (p.x - projX) ** 2 + (p.y - projY) ** 2;
        }

        function eraseWholeStrokeAtPoint(wx, wy) {
            const pt = { x: wx, y: wy };
            for (let i = strokeHistory.length - 1; i >= 0; i--) {
                const s = strokeHistory[i];
                const pts = s.points || [];
                if (pts.length === 0) continue;
                const hitRadius = Math.max(14, getToolWidth(s.strokeTool, s.size) / 2 + 10);
                const hitRadiusSq = hitRadius * hitRadius;
                let hit = false;

                if (pts.length === 1) {
                    hit = ((pt.x - pts[0].x) ** 2 + (pt.y - pts[0].y) ** 2) <= hitRadiusSq;
                } else {
                    for (let j = 0; j < pts.length - 1; j++) {
                        if (distToSegmentSquared(pt, pts[j], pts[j + 1]) <= hitRadiusSq) {
                            hit = true;
                            break;
                        }
                    }
                }

                if (hit) {
                    if (!s.id) s.id = 'st_' + Date.now() + '_' + i;
                    deletedStrokeIds.add(s.id);
                    const removed = strokeHistory.splice(i, 1)[0];
                    recordAction({ kind: 'erase_stroke', stroke: removed, index: i });
                    redrawAllStrokes();
                    broadcastEvent({ type: 'erase_stroke_id', strokeId: removed.id });
                    return true;
                }
            }
            return false;
        }

            } else {

            }
            applySyncedTimerState(newState);

            broadcastEvent({ type: 'timer_sync', state: newState });

        function applySyncedTimerState(st) {
            timerStateData = { ...st };
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            const btnStart = document.getElementById('btn-timer-start');
            if (!st.active) {
                if (btnStart) btnStart.innerText = 'Старт';
                renderTimerSeconds(0);
                return;
            }
            if (st.paused) {
                if (btnStart) btnStart.innerText = 'Пауза';
                renderTimerSeconds(st.remainingSeconds || 0);
                return;
            }
            if (btnStart) btnStart.innerText = 'Идёт';
            const tick = () => {
                const rem = Math.max(0, Math.round((timerStateData.endTimeMs - Date.now()) / 1000));
                renderTimerSeconds(rem);
                if (rem <= 0 && timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            };
            tick();
            timerInterval = setInterval(tick, 1000);
        }

        function changeZoom(delta, centerClientX, centerClientY) {
            if (role === 'student' && followMode) return;
            const vw = viewport.clientWidth || window.innerWidth;
            const vh = viewport.clientHeight || window.innerHeight;
            const minAllowedScale = Math.max(0.45, vw / canvas.width, vh / canvas.height);

            const oldScale = boardScale;
            boardScale = Math.min(2.4, Math.max(minAllowedScale, +(boardScale + delta).toFixed(2)));
            if (oldScale === boardScale) return;

            const cx = centerClientX !== undefined ? centerClientX : vw / 2;
            const cy = centerClientY !== undefined ? centerClientY : vh / 2;
            const worldCenterX = (cx - boardX) / oldScale;
            const worldCenterY = (cy - boardY) / oldScale;

            boardX = cx - worldCenterX * boardScale;
            boardY = cy - worldCenterY * boardScale;

            updateZoomUI(); applyBoardTransform();
            if (role === 'teacher') sendTeacherViewportSync();
        }

        function resetZoom() {
            if (role === 'student' && followMode) return;
            changeZoom(1 - boardScale);
        }

        function updateZoomUI() {

            if (e.target.closest('.widget') || e.target.closest('.board-text-node')) return;
            e.preventDefault();
            const rect = viewport.getBoundingClientRect();
            changeZoom(e.deltaY < 0 ? 0.1 : -0.1, e.clientX - rect.left, e.clientY - rect.top);
        }, { passive: false });

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                drawing = false; panning = false;
                lastPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && lastPinchDist !== null) {
                e.preventDefault();
                const rect = viewport.getBoundingClientRect();
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const diff = dist - lastPinchDist;
                if (Math.abs(diff) > 6) {
                    const cx = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
                    const cy = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
                    changeZoom(diff > 0 ? 0.04 : -0.04, cx, cy);
                    lastPinchDist = dist;
                }
            }
        }, { passive: false });

        viewport.addEventListener('touchend', () => { lastPinchDist = null; });

        function screenToWorld(clientX, clientY) {
            const rect = viewport.getBoundingClientRect();
            return {

            };
        }

            let draggingText = false, resizingText = false;

            node.querySelector('.board-text-drag').addEventListener('pointerdown', (e) => {
                if (role === 'student') return;

            });
            node.querySelector('.text-resize-handle').addEventListener('pointerdown', (e) => {

                    node.style.top = Math.round(origT + (e.clientY - startY) / boardScale) + 'px';
                    broadcastEvent({ type: 'widget_move', id: data.id, left: node.offsetLeft, top: node.offsetTop });
                } else if (resizingText) {
                    const newFont = Math.max(14, Math.min(120, Math.round(origFont + ((e.clientX - startX) + (e.clientY - startY)) / (2 * boardScale) * 0.35)));
                    node.dataset.fontSize = newFont; contentEl.style.fontSize = newFont + 'px';
                    broadcastEvent({ type: 'text_node_resize', id: data.id, fontSize: newFont });
                }
            });
            window.addEventListener('pointerup', () => {
                if (draggingText && (node.offsetLeft !== origL || node.offsetTop !== origT)) {
                    recordAction({ kind: 'move_item', id: data.id, fromLeft: origL, fromTop: origT, toLeft: node.offsetLeft, toTop: node.offsetTop });
                }
                draggingText = false; resizingText = false;
            });

            if (recordInHistory) recordAction({ kind: 'add_item', id: data.id, display: 'flex' });
            if (broadcast) { broadcastEvent({ type: 'spawn_text_node', data }); setTimeout(() => contentEl.focus(), 20); }
        }

            if (header) {
                header.addEventListener('pointerdown', (e) => {
                    if (role === 'student' || widget.classList.contains('locked-widget')) return;

                    isDragging = true; startX = e.clientX; startY = e.clientY; origLeft = widget.offsetLeft; origTop = widget.offsetTop;
                });

            if (resizeHandle) {

                    isResizing = true; startX = e.clientX; startY = e.clientY; origW = widget.offsetWidth; origH = widget.offsetHeight;
                });

                if (isDragging) {

                    widget.style.top = Math.round(origTop + (e.clientY - startY) / boardScale) + 'px';

                } else if (isResizing) {
                    const minW = parseInt(widget.dataset.minW || 180, 10);
                    const minH = parseInt(widget.dataset.minH || 130, 10);
                    const newW = Math.max(minW, Math.round(origW + (e.clientX - startX) / boardScale));

                    widget.style.width = newW + 'px'; widget.style.height = newH + 'px';
                    broadcastEvent({ type: 'widget_resize', id: widget.id, width: newW, height: newH });
                }
            });

            window.addEventListener('pointerup', () => {
                if (isDragging && (widget.offsetLeft !== origLeft || widget.offsetTop !== origTop)) {
                    recordAction({ kind: 'move_item', id: widget.id, fromLeft: origLeft, fromTop: origTop, toLeft: widget.offsetLeft, toTop: widget.offsetTop });
                } else if (isResizing && (widget.offsetWidth !== origW || widget.offsetHeight !== origH)) {
                    recordAction({ kind: 'resize_item', id: widget.id, fromW: origW, fromH: origH, toW: widget.offsetWidth, toH: widget.offsetHeight });
                }
                isDragging = false; isResizing = false;
            });
        }

        function loadLocalMediaFor(event, id) {
            const file = event.target.files[0];
            const v = document.querySelector(`#${id} video`);
            const btnLabel = document.getElementById(`vid-btn-label-${id}`);
            if (!file || !v) return;

            v.src = URL.createObjectURL(file); v.muted = false;
            if (file.size > 45 * 1024 * 1024) { alert('Файл больше 45 МБ.'); return; }
            if (btnLabel) btnLabel.innerText = 'Загрузка для ученика: 0%';

            const reader = new FileReader();
            reader.onload = async (e) => {
                const fullDataUrl = e.target.result;
                if (!roomRef) return;
                try {
                    const chunkSize = 350000;
                    const totalChunks = Math.ceil(fullDataUrl.length / chunkSize);
                    const videoNodeRef = roomRef.child('videoFiles/' + id);
                    await videoNodeRef.remove();
                    for (let i = 0; i < totalChunks; i++) {
                        await videoNodeRef.child('chunks/' + i).set(fullDataUrl.slice(i * chunkSize, (i + 1) * chunkSize));
                        if (btnLabel) btnLabel.innerText = `Загрузка: ${Math.round(((i + 1) / totalChunks) * 100)}%`;
                    }
                    await videoNodeRef.child('meta').set({ totalChunks, name: file.name, updatedAt: Date.now() });
                    if (btnLabel) btnLabel.innerText = `Загружено (${file.name.slice(0, 18)})`;
                    broadcastEvent({ type: 'video_chunks_ready', id });
                } catch (err) { if (btnLabel) btnLabel.innerText = 'Ошибка загрузки'; }
            };
            reader.readAsDataURL(file);
        }

        function base64DataUrlToBlob(dataUrl) {
            const parts = dataUrl.split(',');
            const rawMime = (parts[0].match(/:(.*?);/) || [])[1] || 'video/mp4';
            const mime = rawMime === 'video/quicktime' ? 'video/mp4' : rawMime;
            const bstr = atob(parts[1]); let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) u8arr[n] = bstr.charCodeAt(n);
            return new Blob([u8arr], { type: mime });
        }

        function loadSyncedVideoFromFirebase(id) {
            if (!roomRef) return;
            roomRef.child(`videoFiles/${id}/meta`).on('value', async (metaSnap) => {
                const meta = metaSnap.val();
                if (!meta || !meta.totalChunks) return;
                const btnLabel = document.getElementById(`vid-btn-label-${id}`);
                if (btnLabel && role === 'teacher') btnLabel.innerText = `Готово (${(meta.name || 'Видео').slice(0, 18)})`;
                try {
                    const chunksSnap = await roomRef.child(`videoFiles/${id}/chunks`).once('value');
                    const chunksVal = chunksSnap.val();
                    if (!chunksVal) return;
                    let fullDataUrl = '';
                    for (let i = 0; i < meta.totalChunks; i++) { if (chunksVal[i]) fullDataUrl += chunksVal[i]; }
                    if (!fullDataUrl) return;
                    const v = document.querySelector(`#${id} video`);
                    if (v) { v.src = URL.createObjectURL(base64DataUrlToBlob(fullDataUrl)); v.load(); }
                } catch (e) {}
            });
        }

        function processImageFile(file, targetX, targetY) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const offCanvas = document.createElement('canvas');
                    const scale = img.width > 900 ? 900 / img.width : 1;
                    offCanvas.width = Math.round(img.width * scale);
                    offCanvas.height = Math.round(img.height * scale);
                    offCanvas.getContext('2d').drawImage(img, 0, 0, offCanvas.width, offCanvas.height);
                    const aspect = offCanvas.width / offCanvas.height;
                    const initW = Math.min(340, window.innerWidth - 60);
                    spawnPhotoWidget({
                        id: 'photo-' + Date.now(), left: Math.round(targetX), top: Math.round(targetY),
                        width: initW, height: Math.round((initW - 12) / aspect) + 32, aspect, src: offCanvas.toDataURL('image/jpeg', 0.82)
                    }, true, true);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function attachSpeakingAudioSource(id, srcUrl) {
            if (speakingPlayers[id]) speakingPlayers[id].pause();
            const audio = new Audio(srcUrl);
            speakingPlayers[id] = audio;
            const playBtn = document.getElementById(`spk-play-btn-${id}`);
            const statusLbl = document.getElementById(`spk-status-lbl-${id}`);

            const fillEl = document.getElementById(`spk-fill-${id}`);
            const iconEl = document.getElementById(`spk-play-icon-${id}`);

            if (playBtn) playBtn.disabled = false;
            if (statusLbl) statusLbl.innerText = 'Запись готова к прослушиванию';

            audio.addEventListener('loadedmetadata', () => {
                if (timeLbl && isFinite(audio.duration)) {
                    const m = Math.floor(audio.duration / 60);
                    const s = Math.floor(audio.duration % 60);
                    timeLbl.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                }
            });

            audio.addEventListener('timeupdate', () => {
                if (fillEl && isFinite(audio.duration) && audio.duration > 0) {
                    fillEl.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
                }
                if (timeLbl) {
                    const m = Math.floor(audio.currentTime / 60);
                    const s = Math.floor(audio.currentTime % 60);
                    timeLbl.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                }
            });

            audio.addEventListener('ended', () => {
                if (fillEl) fillEl.style.width = '0%';
                if (iconEl) iconEl.innerHTML = '<polygon points="6 4 20 12 6 20 6 4"/>';
            });
        }

        function seekSpeakingAudio(e, id) {
            const audio = speakingPlayers[id];
            if (!audio || !isFinite(audio.duration) || audio.duration <= 0) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            audio.currentTime = ratio * audio.duration;
        }

        async function toggleSpeakingRecord(id) {
            const btn = document.getElementById(`spk-rec-${id}`);
            const statusLbl = document.getElementById(`spk-status-lbl-${id}`);
            if (!btn) return;
            if (speakingRecorders[id] && speakingRecorders[id].state === 'recording') {
                speakingRecorders[id].stop();
                btn.classList.remove('recording');
                btn.innerText = '● Запись';
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                speakingRecorders[id] = recorder;
                if (statusLbl) statusLbl.innerText = 'Идёт запись голоса...';
                recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        attachSpeakingAudioSource(id, reader.result);
                        broadcastEvent({ type: 'speaking_audio', id, src: reader.result });
                    };
                    reader.readAsDataURL(blob);
                };
                recorder.start();
                btn.classList.add('recording');
                btn.innerText = '■ Стоп';
            } catch (err) { alert('Разрешите доступ к микрофону.'); }
        }

        async function lookupDictionary(id, broadcast, wordOverride) {
            const inputEl = document.getElementById(`dict-in-${id}`); const bodyEl = document.getElementById(`dict-body-${id}`);
            const camLink = document.getElementById(`cam-link-${id}`); const oxfLink = document.getElementById(`oxf-link-${id}`);
            if (!inputEl || !bodyEl) return;
            const word = (wordOverride || inputEl.value).trim().toLowerCase();
            if (!word) return;
            inputEl.value = word;
            if (camLink) camLink.href = `https://dictionary.cambridge.org/dictionary/english-russian/${encodeURIComponent(word)}`;
            if (oxfLink) oxfLink.href = `https://www.oxfordlearnersdictionaries.com/definition/english/${encodeURIComponent(word)}`;
            bodyEl.innerHTML = 'Поиск...';
            if (broadcast) broadcastEvent({ type: 'dict_lookup', id, word });
            try {
                const [oxRes, trRes] = await Promise.allSettled([
                    fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`).then(r => r.json()),
                    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ru`).then(r => r.json())
                ]);
                const ruWord = (trRes.status === 'fulfilled' && trRes.value?.responseData?.translatedText) ? trRes.value.responseData.translatedText : '';
                if (oxRes.status === 'fulfilled' && Array.isArray(oxRes.value) && oxRes.value.length > 0) {
                    const entry = oxRes.value[0];
                    const phonetic = entry.phonetic || (entry.phonetics?.find(p => p.text)?.text) || '';
                    bodyEl.innerHTML = `<div style="margin-bottom:6px;"><b>${entry.word}</b> <span style="color:var(--emerald);">${phonetic}</span></div>` +
                        (ruWord ? `<div style="background:var(--emerald-soft); color:var(--emerald); padding:4px 8px; border-radius:6px; font-weight:700; margin-bottom:6px;">Перевод: ${ruWord}</div>` : '') +
                        `<div>${entry.meanings[0]?.definitions[0]?.definition || ''}</div>`;
                } else if (ruWord) {
                    bodyEl.innerHTML = `<b>${word}</b> — ${ruWord}`;
                } else { bodyEl.innerHTML = 'Слово не найдено.'; }
            } catch (e) { bodyEl.innerHTML = 'Ошибка соединения.'; }
        }

        function flushBoardStateImmediate() {
            clearTimeout(saveStateDebounceTimer);
            try {
                const items = [];
                dynamicItems.querySelectorAll('.widget, .board-text-node').forEach(el => {
                    if (el.style.display === 'none') return;
                    const type = el.dataset.type;
                    const base = { id: el.id, type, left: el.offsetLeft, top: el.offsetTop, width: el.offsetWidth, height: el.offsetHeight };
                    if (type === 'essay') base.text = el.querySelector('textarea').value;

                    items.push(base);
                });
                const cleanStrokes = strokeHistory.filter(s => s && (!s.id || !deletedStrokeIds.has(s.id)));
                const payload = {
                    strokeHistory: cleanStrokes,
                    deletedIds: Array.from(deletedStrokeIds).slice(-200),
                    chatHistory,
                    items
                };
                localStorage.setItem(LOCAL_BOARD_KEY, JSON.stringify(payload));

            } catch (e) {}
        }

        function applyBoardTransform() {
            const vw = viewport.clientWidth || window.innerWidth;
            const vh = viewport.clientHeight || window.innerHeight;
            const minX = Math.min(0, vw - canvas.width * boardScale);
            const minY = Math.min(0, vh - canvas.height * boardScale);
            boardX = Math.min(0, Math.max(minX, boardX));
            boardY = Math.min(0, Math.max(minY, boardY));
            boardWorld.style.transform = `translate3d(${boardX.toFixed(1)}px, ${boardY.toFixed(1)}px, 0) scale(${boardScale})`;
        }

        function getToolWidth(strokeTool, size) {
            if (strokeTool === 'eraser') return size * 4;
            if (strokeTool === 'pencil') return Math.max(2, size * 0.8);
            if (strokeTool === 'highlighter') return size * 4.2;
            return size * 1.4;
        }

        function renderSmoothPath(targetCtx, points, color, strokeTool, size) {
            if (!points || points.length === 0) return;
            targetCtx.save(); targetCtx.beginPath();
            targetCtx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) targetCtx.lineTo(points[i].x, points[i].y);
            if (points.length === 1) targetCtx.lineTo(points[0].x + 0.1, points[0].y + 0.1);
            targetCtx.lineWidth = getToolWidth(strokeTool, size);
            if (strokeTool === 'highlighter') {
                targetCtx.globalCompositeOperation = 'source-over';
                targetCtx.strokeStyle = color;
                targetCtx.globalAlpha = 0.28;
            } else if (strokeTool === 'pencil') {
                targetCtx.globalCompositeOperation = 'source-over';
                targetCtx.strokeStyle = getPencilPattern(color);
                targetCtx.globalAlpha = 0.92;
            } else {
                targetCtx.globalCompositeOperation = 'source-over';
                targetCtx.strokeStyle = color;
            }
            targetCtx.stroke(); targetCtx.restore();
        }

        function clearTempBounds(bounds, pad) {
            tempCtx.clearRect(Math.max(0, bounds.minX - pad), Math.max(0, bounds.minY - pad), (bounds.maxX - bounds.minX) + pad * 2, (bounds.maxY - bounds.minY) + pad * 2);
        }

        // ================= 3. СОБЫТИЯ РИСОВАНИЯ НА ХОЛСТЕ =================
        viewport.addEventListener('pointerdown', (e) => {

                else if (wType === 'essay') createEssayWidget({ id: 'essay-' + Date.now(), left: Math.round(pt.x), top: Math.round(pt.y), width: 350, height: 245, text: '' }, true, true);
                else if (wType === 'sticker') createSticker({ id: 'sticker-' + Date.now(), left: Math.round(pt.x), top: Math.round(pt.y), width: 210, height: 175, theme: 'yellow', text: '' }, true, true);

                return;
            }

            if (e.target.closest('.widget') && !e.target.closest('.photo-widget')) return;

            if (tool === 'pan') {
                if (role === 'student' && followMode) return;
                panning = true; startPanX = e.clientX - boardX; startPanY = e.clientY - boardY;
                viewport.style.cursor = 'grabbing';

            } else if (tool === 'eraser') {
                drawing = true;
                const pt = screenToWorld(e.clientX, e.clientY);
                eraseWholeStrokeAtPoint(pt.x, pt.y);
            } else {
                drawing = true;
                const pt = screenToWorld(e.clientX, e.clientY);
                const startPt = { x: Math.round(pt.x), y: Math.round(pt.y) };
                currentStrokeId = 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                currentStrokePoints = [startPt];
                strokeBounds = { minX: startPt.x, minY: startPt.y, maxX: startPt.x, maxY: startPt.y };
                if (tool === 'highlighter') {
                    renderSmoothPath(tempCtx, currentStrokePoints, currentColor, tool, baseStrokeSize);
                } else {
                    renderSmoothPath(ctx, currentStrokePoints, currentColor, tool, baseStrokeSize);
                }
            }
        });

        viewport.addEventListener('pointermove', (e) => {
            const pt = screenToWorld(e.clientX, e.clientY);
            const worldX = Math.round(pt.x); const worldY = Math.round(pt.y);
            const now = Date.now();

            if (panning) {
                boardX = e.clientX - startPanX; boardY = e.clientY - startPanY; applyBoardTransform();
            } else if (drawing && tool === 'eraser') {
                eraseWholeStrokeAtPoint(worldX, worldY);
            } else if (drawing && tool !== 'pan' && tool !== 'text') {
                const prevPt = currentStrokePoints[currentStrokePoints.length - 1];
                if (!prevPt || Math.abs(worldX - prevPt.x) > 1 || Math.abs(worldY - prevPt.y) > 1) {
                    currentStrokePoints.push({ x: worldX, y: worldY });
                    const pad = getToolWidth(tool, baseStrokeSize) + 12;

                    if (tool === 'highlighter') {
                        clearTempBounds(strokeBounds, pad);
                        strokeBounds.minX = Math.min(strokeBounds.minX, worldX);
                        strokeBounds.minY = Math.min(strokeBounds.minY, worldY);
                        strokeBounds.maxX = Math.max(strokeBounds.maxX, worldX);
                        strokeBounds.maxY = Math.max(strokeBounds.maxY, worldY);
                        renderSmoothPath(tempCtx, currentStrokePoints, currentColor, tool, baseStrokeSize);
                    } else {
                        const len = currentStrokePoints.length;
                        renderSmoothPath(ctx, [currentStrokePoints[len - 2], currentStrokePoints[len - 1]], currentColor, tool, baseStrokeSize);
                    }

                    if (roomRef && now - lastLiveStrokeSentTime > 55) {
                        lastLiveStrokeSentTime = now;
                        roomRef.child(`liveStroke/${role}`).set({
                            active: true,
                            points: currentStrokePoints.slice(-80),
                            color: currentColor,
                            strokeTool: tool,
                            size: baseStrokeSize
                        }).catch(() => {});
                    }
                }
            }

            if (role === 'teacher') {
                if (now - lastMoveSentTime > 50) { lastMoveSentTime = now; sendTeacherViewportSync(worldX, worldY); }
            } else if (now - lastMoveSentTime > 55 && roomRef) {
                lastMoveSentTime = now;
                try { roomRef.child('studentCursor').set({ sender: myClientId, worldX, worldY }).catch(() => {}); } catch (err) {}
            }
        });

        window.addEventListener('pointerup', () => {
            if (drawing && currentStrokePoints.length > 0 && tool !== 'pan' && tool !== 'text' && tool !== 'eraser') {
                if (tool === 'highlighter') {
                    clearTempBounds(strokeBounds, getToolWidth(tool, baseStrokeSize) + 15);
                    renderSmoothPath(ctx, currentStrokePoints, currentColor, tool, baseStrokeSize);
                }
                const finishedStroke = {
                    id: currentStrokeId || ('st_' + Date.now()),
                    points: currentStrokePoints,
                    color: currentColor,
                    strokeTool: tool,
                    size: baseStrokeSize

                strokeHistory.push(finishedStroke);

                broadcastEvent({ type: 'draw_commit', stroke: finishedStroke });
                if (roomRef) {
                    roomRef.child(`liveStroke/${role}`).set({ active: false }).catch(() => {});

        function clearBoard(broadcast) {
            if (role === 'student' && broadcast) return;
            strokeHistory.forEach(s => { if (s && s.id) deletedStrokeIds.add(s.id); });
            strokeHistory = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);

        function handleRemoteEvent(data) {
            if (data.type === 'teacher_move_local') {
                handleTeacherMoveData(data);
            } else if (data.type === 'follow_toggle') {
                followMode = data.followMode;
                document.getElementById('follow-status-pill').style.display = followMode ? 'flex' : 'none';
                updateStudentPanLock();
            } else if (data.type === 'draw_commit' && data.stroke) {
                remoteLiveCtx.clearRect(0, 0, remoteLiveCanvas.width, remoteLiveCanvas.height);
                if (data.stroke.id && deletedStrokeIds.has(data.stroke.id)) return;
                if (!strokeHistory.some(s => s.id && s.id === data.stroke.id)) {
                    strokeHistory.push(data.stroke);
                    actionHistory.push({ kind: 'stroke', stroke: data.stroke });
                    renderSmoothPath(ctx, data.stroke.points, data.stroke.color, data.stroke.strokeTool, data.stroke.size);
                    saveBoardState();
                }
            } else if (data.type === 'erase_stroke_id' && data.strokeId) {
                deletedStrokeIds.add(data.strokeId);
                strokeHistory = strokeHistory.filter(s => s.id !== data.strokeId);
                redrawAllStrokes();
                saveBoardState();
            } else if (data.type === 'restore_stroke' && data.stroke) {
                if (data.stroke.id) deletedStrokeIds.delete(data.stroke.id);
                if (!strokeHistory.some(s => s.id === data.stroke.id)) {
                    strokeHistory.splice(data.index || strokeHistory.length, 0, data.stroke);
                    redrawAllStrokes();
                    saveBoardState();
                }
            } else if (data.type === 'strokes_sync') {
                strokeHistory = (data.strokeHistory || []).filter(s => s && (!s.id || !deletedStrokeIds.has(s.id)));

                if (node && el) { node.dataset.fontSize = data.fontSize; el.style.fontSize = data.fontSize + 'px'; }
            } else if (data.type === 'sticker_text') {

                if (Math.abs(v.currentTime - data.time) > 0.5) v.currentTime = data.time;
                if (data.action === 'play') {
                    v.muted = false;
                    v.play().catch(() => {
                        v.muted = true; v.play().catch(() => {});
                        if (hint) hint.style.display = 'block';
                    });
                } else if (data.action === 'pause') v.pause();
                setTimeout(() => { v.dataset.remote = '0'; }, 180);
            } else if (data.type === 'timer_sync' && data.state) {

        // ================= 4. ВИДЕОСВЯЗЬ И ЗВУК =================
        function setRtcStatus(text) {
            const el = document.getElementById('rtc-status-bar');
            if (el) el.innerText = text;
        }

        function sendRtcSignal(payload) {
            const msg = { ...payload, type: 'webrtc_signal', sender: myClientId, senderRole: role, ts: Date.now() };
            try { localChannel.postMessage(msg); } catch (e) {}
            if (rtcSignalRef) { try { rtcSignalRef.push(msg).catch(() => {}); } catch (e) {} }
        }

        function ensurePeerConnection() {
            if (pc && pc.connectionState !== 'closed' && pc.connectionState !== 'failed') return pc;
            if (pc) { try { pc.close(); } catch (e) {} }

            pc = new RTCPeerConnection(RTC_CONFIG);
            remoteVideoStream = new MediaStream();
            remoteAudioStream = new MediaStream();
            p2pVideoWorking = false;
            p2pAudioWorking = false;

            if (localStream) {
                localStream.getTracks().forEach(track => { pc.addTrack(track, localStream); });
            }

            pc.onicecandidate = (e) => {
                if (e.candidate) sendRtcSignal({ kind: 'ice', candidate: e.candidate.toJSON() });
            };

            pc.onconnectionstatechange = () => {
                if (!pc) return;
                if (pc.connectionState === 'connected') {
                    setRtcStatus('HD-связь активна');
                } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                    p2pVideoWorking = false;
                    p2pAudioWorking = false;
                    setRtcStatus('Резервный поток');
                }
            };

            pc.ontrack = (e) => {
                const track = e.track;
                if (track.kind === 'video') {
                    remoteVideoStream.getVideoTracks().forEach(t => remoteVideoStream.removeTrack(t));
                    remoteVideoStream.addTrack(track);
                    const videoEl = document.getElementById('remoteVideo');
                    const relayImg = document.getElementById('remoteRelayImg');
                    if (videoEl) {
                        videoEl.muted = true;
                        if (videoEl.srcObject !== remoteVideoStream) {
                            videoEl.srcObject = remoteVideoStream;
                        }
                        videoEl.onplaying = () => {
                            p2pVideoWorking = true;
                            videoEl.style.display = 'block';
                            if (relayImg) relayImg.style.display = 'none';
                            document.getElementById('remote-placeholder').style.display = 'none';
                        };
                        videoEl.play().catch(() => {});
                    }
                } else if (track.kind === 'audio') {
                    p2pAudioWorking = true;
                    remoteAudioStream.getAudioTracks().forEach(t => remoteAudioStream.removeTrack(t));
                    remoteAudioStream.addTrack(track);
                    if (remoteVoicePlayer.srcObject !== remoteAudioStream) {
                        remoteVoicePlayer.srcObject = remoteAudioStream;
                    }
                    remoteVoicePlayer.muted = remoteSoundMuted;
                    remoteVoicePlayer.play().catch(() => {});
                }
                setRtcStatus('В эфире');
            };
            return pc;
        }

        function scheduleDebouncedOffer() {
            clearTimeout(offerDebounceTimer);
            offerDebounceTimer = setTimeout(() => {
                makeWebRTCOffer();
            }, 180);
        }

        async function makeWebRTCOffer() {
            const conn = ensurePeerConnection();
            if (makingOffer || conn.signalingState !== 'stable') return;
            try {
                makingOffer = true;
                const offer = await conn.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
                if (conn.signalingState !== 'stable') return;
                await conn.setLocalDescription(offer);
                sendRtcSignal({
                    kind: 'sdp',
                    description: { type: conn.localDescription.type, sdp: conn.localDescription.sdp },
                    hasVideo: cameraActive,
                    hasAudio: micActive
                });
            } catch (e) {} finally {
                makingOffer = false;
            }
        }

        async function handleWebRTCSignal(data) {
            if (!data || data.sender === myClientId) return;
            const conn = ensurePeerConnection();
            const polite = myClientId < data.sender;

            try {
                if (data.kind === 'hello') {
                    sendRtcSignal({ kind: 'media_state', hasVideo: cameraActive, hasAudio: micActive });
                    scheduleDebouncedOffer();
                } else if (data.kind === 'sdp' && data.description) {
                    const desc = data.description;
                    const offerCollision = (desc.type === 'offer') && (makingOffer || conn.signalingState !== 'stable');
                    ignoreOffer = !polite && offerCollision;
                    if (ignoreOffer) return;

                    if (offerCollision) {
                        await Promise.all([
                            conn.setLocalDescription({ type: 'rollback' }),
                            conn.setRemoteDescription(new RTCSessionDescription(desc))
                        ]);
                    } else {
                        await conn.setRemoteDescription(new RTCSessionDescription(desc));
                    }

                    while (pendingIceCandidates.length > 0) {
                        const c = pendingIceCandidates.shift();
                        try { await conn.addIceCandidate(new RTCIceCandidate(c)); } catch (err) {}
                    }

                    if (desc.type === 'offer') {
                        const answer = await conn.createAnswer();
                        await conn.setLocalDescription(answer);
                        sendRtcSignal({
                            kind: 'sdp',
                            description: { type: conn.localDescription.type, sdp: conn.localDescription.sdp },
                            hasVideo: cameraActive,
                            hasAudio: micActive
                        });
                    }
                } else if (data.kind === 'ice' && data.candidate) {
                    if (conn.remoteDescription && conn.remoteDescription.type) {
                        try { await conn.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (err) {}
                    } else {
                        pendingIceCandidates.push(data.candidate);
                    }
                } else if (data.kind === 'media_state') {
                    updateRemotePlaceholder(data.hasVideo, data.hasAudio);
                }
            } catch (err) {}
        }

        function initWebRTC() {
            ensurePeerConnection();
            if (!roomRef) return;

            rtcSignalRef = roomRef.child('rtcSignals');
            let initialSignalsSkipped = false;
            rtcSignalRef.limitToLast(1).on('child_added', (snap) => {
                if (!initialSignalsSkipped) {
                    initialSignalsSkipped = true;
                    return;
                }
                const val = snap.val();
                if (!val || val.sender === myClientId) return;
                handleWebRTCSignal(val);
            });

            roomRef.child(`liveMedia/${peerRole}/video`).on('value', (snap) => {
                const data = snap.val();
                if (!data) return;
                const relayImg = document.getElementById('remoteRelayImg');
                const videoEl = document.getElementById('remoteVideo');
                const placeholderEl = document.getElementById('remote-placeholder');

                if (data.active && data.frame) {
                    if (!p2pVideoWorking) {
                        relayImg.src = data.frame;
                        relayImg.style.display = 'block';
                        placeholderEl.style.display = 'none';
                        setRtcStatus('В эфире');
                    }
                } else if (data.active === false) {
                    relayImg.style.display = 'none';
                    videoEl.style.display = 'none';
                    p2pVideoWorking = false;
                    placeholderEl.style.display = 'block';
                }
            });

            let initialAudioSkipped = false;
            roomRef.child(`liveMedia/${peerRole}/audio`).on('value', (snap) => {
                if (!initialAudioSkipped) { initialAudioSkipped = true; return; }
                const data = snap.val();
                if (!data || remoteSoundMuted) return;
                if (p2pAudioWorking && pc && pc.connectionState === 'connected') return;
                if (data.ts && Math.abs(Date.now() - data.ts) > 2500) return;
                playPcmAudioPacket(data.pcm, data.rate || 16000);
                setRtcStatus('В эфире');
            });

            setTimeout(() => {
                sendRtcSignal({ kind: 'hello' });
            }, 350);
        }

        function ensureAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function playPcmAudioPacket(b64, sampleRate = 16000) {
            if (!b64 || remoteSoundMuted) return;
            const actx = ensureAudioContext();
            if (!actx) return;
            try {
                const binary = atob(b64);
                const len = binary.length / 2;
                const buffer = actx.createBuffer(1, len, sampleRate);
                const channel = buffer.getChannelData(0);
                for (let i = 0; i < len; i++) {
                    const lo = binary.charCodeAt(i * 2);
                    const hi = binary.charCodeAt(i * 2 + 1);
                    let val = (hi << 8) | lo;
                    if (val >= 0x8000) val -= 0x10000;
                    channel[i] = val / 32768;
                }
                const src = actx.createBufferSource();
                src.buffer = buffer;
                src.connect(actx.destination);
                const now = actx.currentTime;
                if (nextAudioPlayTime < now || nextAudioPlayTime > now + 0.24) {
                    nextAudioPlayTime = now + 0.025;
                }
                src.start(nextAudioPlayTime);
                nextAudioPlayTime += buffer.duration;
            } catch (e) {}
        }

        function startFirebaseAudioRelay() {
            if (!localStream || !roomRef) return;
            const actx = ensureAudioContext();
            if (!actx) return;
            stopFirebaseAudioRelay();

            try {
                audioSourceNode = actx.createMediaStreamSource(localStream);
                audioProcessor = actx.createScriptProcessor(4096, 1, 1);
                const inRate = actx.sampleRate || 44100;
                const outRate = 16000;
                const ratio = inRate / outRate;
                let accum = [];
                let isSendingAudio = false;

                audioProcessor.onaudioprocess = (e) => {
                    if (!micActive) return;
                    if (p2pAudioWorking && pc && pc.connectionState === 'connected') return;

                    const input = e.inputBuffer.getChannelData(0);
                    let sumSq = 0;
                    for (let i = 0; i < input.length; i += 4) sumSq += input[i] * input[i];
                    const rms = Math.sqrt(sumSq / (input.length / 4));
                    if (rms < 0.006 && accum.length === 0) return;

                    for (let i = 0; i < input.length; i += ratio) {
                        const s = Math.max(-1, Math.min(1, input[Math.floor(i)] || 0));
                        accum.push(s < 0 ? s * 0x8000 : s * 0x7FFF);
                    }

                    if (accum.length >= 2560) {
                        const chunk = accum.splice(0, 2560);
                        if (accum.length > 5120) accum = [];
                        if (isSendingAudio) return;
                        isSendingAudio = true;

                        const int16 = new Int16Array(chunk);
                        const bytes = new Uint8Array(int16.buffer);
                        let bin = '';
                        for (let j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
                        roomRef.child(`liveMedia/${role}/audio`).set({
                            sender: myClientId,
                            rate: outRate,
                            pcm: btoa(bin),
                            ts: Date.now()
                        }).finally(() => { isSendingAudio = false; }).catch(() => {});
                    }
                };

                audioSourceNode.connect(audioProcessor);
                audioProcessor.connect(actx.destination);
            } catch (e) {}
        }

        function stopFirebaseAudioRelay() {
            if (audioProcessor) { try { audioProcessor.disconnect(); } catch (e) {} audioProcessor = null; }
            if (audioSourceNode) { try { audioSourceNode.disconnect(); } catch (e) {} audioSourceNode = null; }
        }

        function startFirebaseVideoRelay() {
            clearInterval(videoRelayTimer);
            const localVid = document.getElementById('localVideo');
            videoRelayTimer = setInterval(() => {
                if (!cameraActive || !localVid || !roomRef || isUploadingFrame) return;
                if (p2pVideoWorking && pc && pc.connectionState === 'connected') return;
                if (localVid.readyState >= 2 && localVid.videoWidth > 0) {
                    try {
                        isUploadingFrame = true;
                        relayCaptureCtx.drawImage(localVid, 0, 0, 300, 220);
                        const frameData = relayCaptureCanvas.toDataURL('image/jpeg', 0.65);
                        roomRef.child(`liveMedia/${role}/video`).set({
                            sender: myClientId,
                            active: true,
                            frame: frameData,
                            ts: Date.now()
                        }).finally(() => {
                            isUploadingFrame = false;
                        }).catch(() => {});
                    } catch (e) {
                        isUploadingFrame = false;
                    }
                }
            }, 140);
        }

        function stopFirebaseVideoRelay() {
            clearInterval(videoRelayTimer);
            videoRelayTimer = null;
            isUploadingFrame = false;
            if (roomRef) {
                roomRef.child(`liveMedia/${role}/video`).set({ sender: myClientId, active: false, ts: Date.now() }).catch(() => {});
            }
        }

        function reconnectWebRTC() {
            unlockAudioPlayback();
            setRtcStatus('Обновление...');
            if (pc) { try { pc.close(); } catch (e) {} pc = null; }
            ensurePeerConnection();
            sendRtcSignal({ kind: 'hello' });
            scheduleDebouncedOffer();
        }

        function cleanupWebRTC() {
            stopFirebaseVideoRelay();
            stopFirebaseAudioRelay();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (pc) { try { pc.close(); } catch (e) {} }
        }

        function unlockAudioPlayback() {
            ensureAudioContext();
            if (remoteVoicePlayer && remoteVoicePlayer.srcObject && remoteVoicePlayer.paused) {
                remoteVoicePlayer.play().catch(() => {});
            }
            ['localVideo', 'remoteVideo'].forEach(id => {
                const v = document.getElementById(id);
                if (v && v.srcObject && v.paused) v.play().catch(() => {});
            });
        }

        function updateRemotePlaceholder(hasVideo, hasAudio) {
            const placeholderEl = document.getElementById('remote-placeholder');
            const relayImg = document.getElementById('remoteRelayImg');
            const videoEl = document.getElementById('remoteVideo');
            if (!placeholderEl) return;
            if (!hasVideo) {
                if (relayImg) relayImg.style.display = 'none';
                if (videoEl) videoEl.style.display = 'none';
                p2pVideoWorking = false;
                placeholderEl.style.display = 'block';
            } else {
                placeholderEl.style.display = 'none';
            }
            placeholderEl.innerText = hasAudio ? `${peerUserName} (Голос активен)` : `Камера: ${peerUserName}`;
        }

        function showLocalPreview() {
            const localVid = document.getElementById('localVideo');
            const localLbl = document.getElementById('local-pip-label');
            if (!localVid || !localLbl) return;
            localVid.muted = true;
            if (cameraActive && localStream && localStream.getVideoTracks().length > 0) {
                if (localVid.srcObject !== localStream) {
                    localVid.srcObject = localStream;
                }
                localVid.style.display = 'block';
                localVid.play().catch(() => {});
                localLbl.style.display = 'none';
            } else {
                localVid.srcObject = null;
                localVid.style.display = 'none';
                localLbl.style.display = 'block';
                localLbl.innerText = micActive ? `${myUserName} (Микр.)` : myUserName;
            }
        }

        async function attachOrReplaceTrack(newTrack) {
            const conn = ensurePeerConnection();
            const sender = conn.getSenders().find(s => s.track && s.track.kind === newTrack.kind);
            if (sender) {
                await sender.replaceTrack(newTrack);
            } else {
                conn.addTrack(newTrack, localStream);
            }
            sendRtcSignal({ kind: 'media_state', hasVideo: cameraActive, hasAudio: micActive });
            scheduleDebouncedOffer();
        }

        async function toggleMic() {
            unlockAudioPlayback();
            const micBtn = document.getElementById('btn-mic-toggle');
            if (localStream && localStream.getAudioTracks().length > 0) {
                micActive = !micActive;
                localStream.getAudioTracks().forEach(t => t.enabled = micActive);
                micBtn.classList.toggle('lit', micActive);
                showLocalPreview();
                sendRtcSignal({ kind: 'media_state', hasVideo: cameraActive, hasAudio: micActive });
                return;
            }
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                    video: false
                });
                const audioTrack = audioStream.getAudioTracks()[0];
                if (!localStream) localStream = new MediaStream();
                localStream.addTrack(audioTrack);
                micActive = true;
                micBtn.classList.add('lit');
                showLocalPreview();
                startFirebaseAudioRelay();
                await attachOrReplaceTrack(audioTrack);
            } catch (err) {
                alert('Разрешите доступ к микрофону в настройках браузера.');
            }
        }

        function toggleRemoteSound() {
            remoteSoundMuted = !remoteSoundMuted;
            const soundBtn = document.getElementById('btn-sound-toggle');
            soundBtn.classList.toggle('lit', !remoteSoundMuted);
            if (remoteVoicePlayer) {
                remoteVoicePlayer.muted = remoteSoundMuted;
                if (!remoteSoundMuted) remoteVoicePlayer.play().catch(() => {});
            }
        }

        async function toggleCamera() {
            unlockAudioPlayback();
            const camBtn = document.getElementById('btn-cam-toggle');
            if (cameraActive && localStream) {
                localStream.getVideoTracks().forEach(track => {
                    track.stop();
                    localStream.removeTrack(track);
                });
                cameraActive = false;
                camBtn.classList.remove('lit');
                stopFirebaseVideoRelay();
                showLocalPreview();
                sendRtcSignal({ kind: 'media_state', hasVideo: cameraActive, hasAudio: micActive });
                scheduleDebouncedOffer();
                return;
            }
            try {
                const needAudio = !localStream || localStream.getAudioTracks().length === 0;
                const media = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24, max: 30 }, facingMode: 'user' },
                    audio: needAudio ? { echoCancellation: true, noiseSuppression: true, autoGainControl: true } : false
                });
                if (!localStream) localStream = new MediaStream();

                const videoTrack = media.getVideoTracks()[0];
                if (videoTrack) {
                    localStream.addTrack(videoTrack);
                    cameraActive = true;
                    camBtn.classList.add('lit');
                    await attachOrReplaceTrack(videoTrack);
                }

                const audioTrack = media.getAudioTracks()[0];
                if (audioTrack) {
                    localStream.addTrack(audioTrack);
                    micActive = true;
                    document.getElementById('btn-mic-toggle').classList.add('lit');
                    startFirebaseAudioRelay();
                    await attachOrReplaceTrack(audioTrack);
                }

                showLocalPreview();
                startFirebaseVideoRelay();
            } catch (err) {
                alert('Разрешите доступ к камере и микрофону в настройках браузера.');
            }
        }

        // ================= 5. ЗАПУСК ВСЕХ СИСТЕМ В КОНЦЕ СКРИПТА =================
        applyVerifiedRole(role);
        applyBoardTransform();
        startSmoothAnimationLoop();
        initRealtimeSync();
        initWebRTC();
    </script>
</body>
</html>
