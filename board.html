<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESpace — Интерактивный урок</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-page: #080c0b;
            --bg-surface: #0f1513;
            --bg-elevated: #151d1a;
            --bg-subtle: #1a2420;
            --bg-hover: #212e29;
            --surface-grad: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0) 100%);
            --spec-top: rgba(255, 255, 255, 0.1);
            --text-primary: #f2f7f5;
            --text-secondary: #92a39c;
            --text-muted: #596963;
            --border: #1c2622;
            --border-strong: #283731;
            --emerald: #10a372;
            --emerald-hover: #0d8a60;
            --emerald-glow: rgba(16, 163, 114, 0.25);
            --emerald-soft: rgba(16, 163, 114, 0.15);
            --emerald-border: rgba(16, 163, 114, 0.4);
            --danger: #ef4444;
            --danger-soft: rgba(239, 68, 68, 0.14);
            --danger-border: rgba(239, 68, 68, 0.35);
            --dot-color: rgba(146, 163, 156, 0.18);
            --island-shadow: 0 14px 32px -8px rgba(0, 0, 0, 0.6);
        }

        body.light-theme {
            --bg-page: #f3f6f4;
            --bg-surface: #ffffff;
            --bg-elevated: #f8faf9;
            --bg-subtle: #ebf1ee;
            --bg-hover: #e0e9e4;
            --surface-grad: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 251, 249, 0.6) 100%);
            --spec-top: rgba(255, 255, 255, 1);
            --text-primary: #0f1714;
            --text-secondary: #55665f;
            --text-muted: #84948d;
            --border: #dce5e0;
            --border-strong: #c6d4cd;
            --emerald: #0c855c;
            --emerald-hover: #096c4a;
            --emerald-glow: rgba(12, 133, 92, 0.16);
            --emerald-soft: #e3f5ee;
            --emerald-border: #9edbc4;
            --danger: #dc2626;
            --danger-soft: #fef2f2;
            --danger-border: #fecaca;
            --dot-color: rgba(15, 23, 20, 0.15);
            --island-shadow: 0 10px 26px -6px rgba(15, 23, 20, 0.1);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        }
        html, body {
            overflow: hidden; background: var(--bg-page); color: var(--text-primary);
            height: 100%; width: 100%; position: fixed; inset: 0; touch-action: none;
        }

        .font-display { font-family: 'Unbounded', 'Inter', sans-serif; letter-spacing: -0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

        .classroom-layout {
            display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden;
        }

        /* ================= 1. ВЕРХНЯЯ ПАНЕЛЬ ================= */
        .class-topbar {
            height: 54px; background: var(--bg-surface); background-image: var(--surface-grad);
            border-bottom: 1px solid var(--border);
            padding: 0 14px; display: flex; align-items: center; justify-content: space-between;
            gap: 10px; flex-shrink: 0; z-index: 160; overflow-x: auto; scrollbar-width: none;
        }
        .class-topbar::-webkit-scrollbar { display: none; }
        .topbar-left, .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; height: 100%; }

        .top-btn {
            height: 32px; padding: 0 12px; border-radius: 8px;
            border: 1px solid var(--border-strong); border-top-color: var(--spec-top);
            background: var(--bg-elevated); color: var(--text-primary);
            font-size: 12px; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; transition: 0.15s; white-space: nowrap;
        }
        .top-btn:hover { background: var(--bg-hover); }
        .top-btn.active { background: var(--emerald-soft); border-color: var(--emerald); color: var(--emerald); font-weight: 700; }
        .top-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }
        .top-btn-icon { width: 32px; padding: 0; }
        .top-btn-danger {
            background: var(--danger-soft); border-color: var(--danger-border); color: var(--danger); font-weight: 700;
        }
        .top-btn-danger:hover { background: var(--danger); color: #fff; }

        .lesson-title-text {
            font-size: 13px; font-weight: 700; color: var(--text-primary);
            padding: 0 6px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .top-tabs { display: flex; align-items: center; height: 100%; margin-left: 4px; }
        .top-tab {
            height: 100%; padding: 0 12px; border: none; background: transparent;
            color: var(--text-secondary); font-size: 12px; font-weight: 600;
            cursor: pointer; position: relative; display: inline-flex; align-items: center;
        }
        .top-tab:hover { color: var(--text-primary); }
        .top-tab.active { color: var(--text-primary); font-weight: 700; }
        .top-tab.active::after {
            content: ''; position: absolute; bottom: 0; left: 8px; right: 8px;
            height: 2.5px; background: var(--emerald); border-radius: 2px 2px 0 0;
            box-shadow: 0 -2px 8px var(--emerald-glow);
        }

        .timer-pill {
            height: 32px; padding: 0 11px; border-radius: 8px;
            border: 1px solid var(--border-strong); border-top-color: var(--spec-top);
            background: var(--bg-elevated);
            display: inline-flex; align-items: center; gap: 8px; font-size: 12px;
        }
        .timer-digits { font-weight: 700; color: var(--emerald); }
        .timer-action-link {
            border: none; background: none; color: var(--text-primary);
            font-size: 11px; font-weight: 700; cursor: pointer; padding: 2px 6px;
            border-radius: 5px; background: var(--bg-subtle);
        }
        .timer-action-link:hover { background: var(--emerald); color: #fff; }

        .follow-switch-wrap {
            height: 32px; padding: 0 10px; border-radius: 8px;
            display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
            font-size: 12px; font-weight: 600; color: var(--text-primary);
            border: 1px solid var(--border); background: var(--bg-elevated);
        }
        .switch-track {
            width: 32px; height: 18px; border-radius: 999px;
            background: var(--border-strong); position: relative; transition: 0.18s;
        }
        .switch-thumb {
            width: 14px; height: 14px; border-radius: 50%; background: #fff;
            position: absolute; top: 2px; left: 2px; transition: 0.18s;
        }
        .follow-switch-wrap.active .switch-track { background: var(--emerald); }
        .follow-switch-wrap.active .switch-thumb { transform: translateX(14px); }

        /* ================= 2. РАБОЧАЯ ЗОНА И ХОЛСТ ================= */
        .class-body {
            flex: 1; display: flex; min-height: 0; position: relative; overflow: hidden;
        }

        #board-viewport {
            flex: 1; height: 100%; width: 100%; overflow: hidden; position: relative;
            cursor: crosshair; touch-action: none; background-color: var(--bg-page);
        }

        #board-world {
            width: 4200px; height: 3000px; position: absolute; top: 0; left: 0;
            transform-origin: 0 0; will-change: transform; touch-action: none;
            background-color: var(--bg-page);
            background-image: radial-gradient(var(--dot-color) 1.4px, transparent 1.4px);
            background-size: 24px 24px;
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 25; pointer-events: none; }
        #temp-canvas { z-index: 26; }
        #remote-live-canvas { z-index: 27; }

        .follow-status-pill {
            position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
            background: var(--bg-surface); background-image: var(--surface-grad);
            border: 1px solid var(--border-strong); border-top-color: var(--spec-top);
            padding: 6px 14px; border-radius: 999px; font-size: 11px; font-weight: 600;
            color: var(--text-secondary); display: flex; align-items: center; gap: 7px;
            box-shadow: var(--island-shadow); z-index: 110; pointer-events: none;
        }
        .follow-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }

        /* Левая вертикальная панель инструментов */
        .left-toolbar {
            position: absolute; top: 14px; left: 14px;
            background: var(--bg-surface); background-image: var(--surface-grad);
            border: 1px solid var(--border-strong); border-top-color: var(--spec-top);
            border-radius: 13px; padding: 6px;
            display: flex; flex-direction: column; gap: 5px;
            box-shadow: var(--island-shadow); z-index: 120;
        }
        .v-tool-btn {
            width: 36px; height: 36px; border-radius: 9px; border: 1px solid transparent;
            background: transparent; color: var(--text-secondary);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.14s;
        }
        .v-tool-btn svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.9; fill: none; }
        .v-tool-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .v-tool-btn.active {
            background: var(--emerald-soft); border-color: var(--emerald-border); color: var(--emerald);
        }
        .v-tool-btn.disabled-pan { opacity: 0.35; pointer-events: none; }

        /* Всплывающая карточка настроек */
        .tool-settings-card {
            position: absolute; top: 64px; left: 68px;
            background: var(--bg-surface); background-image: var(--surface-grad);
            border: 1px solid var(--border-strong); border-top-color: var(--spec-top);
            border-radius: 13px; padding: 12px 14px; width: 210px;
            box-shadow: var(--island-shadow); z-index: 120;
            display: none; flex-direction: column; gap: 10px;
        }
        .tool-settings-title { font-size: 12px; font-weight: 700; color: var(--text-primary); }
        .color-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .color-swatch {
            width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
            border: 2px solid var(--bg-surface); box-shadow: 0 0 0 1px var(--border-strong);
            transition: 0.12s;
        }
        .color-swatch.active { box-shadow: 0 0 0 2px var(--emerald); transform: scale(1.14); }
        .thickness-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: -4px; }
        .thickness-range { width: 100%; accent-color: var(--emerald); cursor: pointer; }

        /* Нижний левый островок */
        .bottom-left-island {
            position: absolute; bottom: 14px; left: 14px;
            background: var(--bg-surface); background-image: var(--surface-grad);
            border: 1px solid var(--border-strong); border-top-color: var(--spec-top);
            border-radius: 11px; padding: 4px 6px;
            display: flex; align-items: center; gap: 4px;
            box-shadow: var(--island-shadow); z-index: 120;
        }
        .island-btn {
            width: 32px; height: 32px; border-radius: 8px; border: none;
            background: transparent; color: var(--text-secondary);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .island-btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; }
        .island-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .island-btn.danger { color: var(--danger); }
        .island-btn.danger:hover { background: var(--danger-soft); }

        /* Нижний правый островок: Масштаб */
        .bottom-right-island {
            position: absolute; bottom: 14px; right: 14px;
            background: var(--bg-surface); background-image: var(--surface-grad);
            border: 1px solid var(--border-strong); border-top-color: var(--spec-top);
            border-radius: 11px; padding: 4px 8px;
            display: flex; align-items: center; gap: 6px;
            box-shadow: var(--island-shadow); z-index: 120;
        }
        .zoom-pct {
            font-size: 12px; font-weight: 700; color: var(--text-primary);
            min-width: 44px; text-align: center; cursor: pointer;
        }

        /* Плавный GPU-курсор собеседника */
        #remote-peer-cursor {
            position: absolute; top: 0; left: 0; pointer-events: none; z-index: 75;
            display: none; will-change: transform;
        }
        .peer-cursor-tag {
            background: var(--emerald); color: #fff; font-size: 10px; font-weight: 700;
            padding: 2px 8px; border-radius: 6px; margin-left: 12px; margin-top: -4px;
            white-space: nowrap; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
        }

        /* ================= 3. ПРАВАЯ КОЛОНКА ================= */
        .class-sidebar {
            width: 292px; background: var(--bg-surface); background-image: var(--surface-grad);
            border-left: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 12px; gap: 10px;
            flex-shrink: 0; z-index: 140; min-height: 0;
        }
        .class-sidebar.collapsed { display: none !important; }

        .class-sidebar.chat-hidden-mode {
            position: absolute; top: 12px; right: 12px;
            height: auto; width: 286px;
            border: 1px solid var(--border-strong); border-top-color: var(--spec-top);
            border-radius: 14px; box-shadow: var(--island-shadow);
        }

        .pip-camera-stage {
            width: 100%; height: 168px; background: #101614; border-radius: 11px;
            position: relative; overflow: hidden; border: 1px solid var(--border-strong); flex-shrink: 0;
        }

        .cam-slot {
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            background: #101614; transition: all 0.2s ease;
        }
        .cam-slot.cam-main {
            position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; cursor: default;
        }
        .cam-slot.cam-pip {
            position: absolute; bottom: 8px; right: 8px; width: 84px; height: 60px;
            border-radius: 8px; background: #1b2420;
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            z-index: 5; cursor: pointer; box-shadow: 0 6px 14px rgba(0,0,0,0.5);
        }
        .cam-slot.cam-pip:hover {
            border-color: var(--emerald); transform: scale(1.04);
        }

        .cam-slot video, .cam-slot img {
            width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0;
            transform: scaleX(-1);
        }
        #remoteVideo { z-index: 2; display: none; }
        #remoteRelayImg { z-index: 1; display: none; }
        #localVideo { z-index: 2; display: none; }

        .cam-slot-placeholder {
            color: var(--text-secondary); font-size: 12px; font-weight: 600;
            z-index: 3; pointer-events: none; text-align: center; padding: 6px;
        }
        .cam-slot.cam-pip .cam-slot-placeholder { font-size: 10px; }

        .cam-slot-badge {
            position: absolute; bottom: 7px; left: 8px; z-index: 4;
            background: rgba(15, 21, 19, 0.82); backdrop-filter: blur(4px); color: #fff;
            border: 1px solid rgba(255,255,255,0.12);
            font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
            pointer-events: none; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .cam-slot.cam-pip .cam-slot-badge {
            bottom: 4px; left: 5px; font-size: 9px; padding: 1px 5px;
        }

        .media-bar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 5px; padding: 2px 0; flex-shrink: 0;
        }
        .media-circles { display: flex; align-items: center; gap: 6px; }
        .circle-ctrl-btn {
            width: 34px; height: 34px; border-radius: 50%;
            border: 1px solid var(--border-strong); background: var(--bg-elevated);
            color: var(--text-primary); cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.15s;
        }
        .circle-ctrl-btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; }
        .circle-ctrl-btn:hover { background: var(--bg-hover); }
        .circle-ctrl-btn.lit {
            background: var(--emerald-soft); border-color: var(--emerald); color: var(--emerald);
            box-shadow: 0 0 12px var(--emerald-glow);
        }

        .rtc-status-inline {
            display: flex; align-items: center; gap: 5px;
            font-size: 11px; font-weight: 600; color: var(--text-secondary);
            line-height: 1.15; flex: 1; justify-content: center;
        }
        .rtc-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); flex-shrink: 0; }
        .rtc-refresh-btn {
            width: 28px; height: 28px; border-radius: 50%; border: none;
            background: transparent; color: var(--text-secondary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .rtc-refresh-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .rtc-refresh-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }

        /* Чат */
        .chat-section {
            flex: 1; border-top: 1px solid var(--border); padding-top: 8px;
            display: flex; flex-direction: column; min-height: 0;
        }
        .chat-section.hidden { display: none !important; }
        .chat-header-row {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
        }
        .chat-title { font-size: 12px; font-weight: 700; color: var(--text-primary); }
        .chat-hide-btn {
            border: none; background: transparent; color: var(--text-secondary);
            font-size: 11px; font-weight: 600; cursor: pointer; padding: 2px 6px; border-radius: 5px;
        }
        .chat-hide-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }

        .chat-messages {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column;
            gap: 6px; font-size: 12px; padding-right: 2px;
            user-select: text; -webkit-user-select: text;
        }
        .chat-empty { margin: auto; font-size: 12px; color: var(--text-muted); text-align: center; }
        .chat-msg {
            background: var(--bg-elevated); border: 1px solid var(--border);
            padding: 7px 10px; border-radius: 9px; line-height: 1.4; word-break: break-word;
        }
        .chat-msg.mine {
            background: var(--emerald-soft); border-color: var(--emerald-border);
        }
        .chat-msg-author { font-size: 11px; font-weight: 700; color: var(--emerald); margin-bottom: 2px; }
        .chat-input-row {
            display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
        }
        .chat-input {
            flex: 1; height: 34px; padding: 0 11px; border-radius: 8px;
            border: 1px solid var(--border-strong); background: var(--bg-elevated);
            color: var(--text-primary); font-size: 12px; outline: none;
            user-select: text; -webkit-user-select: text;
        }
        .chat-input:focus { border-color: var(--emerald); }
        .chat-send-btn {
            width: 34px; height: 34px; border-radius: 8px; border: none;
            background: var(--emerald); color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .chat-send-btn:hover { background: var(--emerald-hover); }

        /* Всплывающее меню виджетов и таймера */
        .popover-box {
            position: fixed; top: 58px; right: 90px;
            background: var(--bg-surface); background-image: var(--surface-grad);
            border: 1px solid var(--border-strong); border-top-color: var(--spec-top);
            border-radius: 14px; padding: 14px; width: 320px; max-width: 94vw;
            box-shadow: var(--island-shadow); z-index: 220; display: none;
        }
        .popover-head {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border);
            font-size: 13px; font-weight: 700;
        }
        .widget-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
        .widget-pick-btn {
            border: 1px solid var(--border-strong); border-radius: 8px; padding: 9px 11px;
            background: var(--bg-elevated); color: var(--text-primary);
            font-size: 12px; font-weight: 600; cursor: pointer; text-align: left;
            display: flex; align-items: center; justify-content: space-between; transition: 0.14s;
        }
        .widget-pick-btn:hover {
            background: var(--emerald-soft); border-color: var(--emerald); color: var(--emerald);
        }

        #placement-banner {
            position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
            background: var(--emerald); color: #fff; padding: 7px 16px;
            border-radius: 999px; font-size: 12px; font-weight: 700;
            box-shadow: 0 8px 24px var(--emerald-glow);
            display: none; align-items: center; gap: 10px; z-index: 200;
        }
        .placement-cancel-btn {
            background: rgba(255,255,255,0.2); border: none; color: #fff;
            padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; cursor: pointer;
        }

        /* ================= 4. ВИДЖЕТЫ ================= */
        .widget {
            position: absolute; background: var(--bg-surface); background-image: var(--surface-grad);
            border-radius: 13px; box-shadow: var(--island-shadow);
            border: 1px solid var(--border-strong); border-top-color: var(--spec-top);
            padding: 6px 10px 12px 10px; z-index: 35;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .widget.photo-widget {
            z-index: 15; padding: 4px 6px 6px 6px; min-width: 120px; min-height: 80px;
        }
        .widget.locked-widget .resize-handle { display: none !important; }
        .widget.locked-widget .widget-header { cursor: default; }
        .widget-header {
            position: relative;
            display: flex; justify-content: space-between; align-items: center;
            cursor: move; padding: 2px 2px 6px 2px; flex-shrink: 0; min-height: 28px; touch-action: none;
        }
        .widget-actions-left, .widget-actions-right { display: flex; align-items: center; gap: 4px; z-index: 2; }
        .grip-bar {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 36px; height: 4px; background: var(--border-strong); border-radius: 8px;
            pointer-events: none;
        }
        .header-icon-btn, .close-btn {
            height: 22px; padding: 0 7px; border-radius: 5px; border: 1px solid var(--border-strong);
            background: var(--bg-elevated); color: var(--text-secondary);
            font-size: 10px; font-weight: 700; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .header-icon-btn.locked-active {
            background: var(--emerald-soft); border-color: var(--emerald); color: var(--emerald);
        }
        .close-btn:hover { background: var(--danger-soft); border-color: var(--danger-border); color: var(--danger); }

        .resize-handle {
            position: absolute; right: 2px; bottom: 2px; width: 20px; height: 20px;
            cursor: nwse-resize; display: flex; align-items: flex-end; justify-content: flex-end;
            color: var(--text-muted); font-size: 11px; padding: 2px; z-index: 30; touch-action: none;
        }

        .board-text-node {
            position: absolute; z-index: 28; min-width: 70px; max-width: 900px;
            padding: 6px 14px 10px 8px; border-radius: 10px;
            border: 1.5px dashed transparent; display: flex; align-items: flex-start; gap: 6px;
        }
        .board-text-node:hover, .board-text-node:focus-within {
            border-color: var(--emerald); background: rgba(15, 21, 19, 0.75);
        }
        body.light-theme .board-text-node:hover, body.light-theme .board-text-node:focus-within {
            background: rgba(255, 255, 255, 0.88);
        }
        .board-text-drag { cursor: move; color: var(--text-muted); font-size: 13px; padding: 2px 4px; opacity: 0; touch-action: none; }
        .board-text-node:hover .board-text-drag, .board-text-node:focus-within .board-text-drag { opacity: 1; }
        .board-text-content {
            outline: none; user-select: text; -webkit-user-select: text; cursor: text;
            font-weight: 700; line-height: 1.3; white-space: pre-wrap; word-break: break-word; min-width: 45px;
        }
        .board-text-content:empty:before { content: 'Введите текст...'; color: var(--text-muted); font-weight: 400; }
        .board-text-del {
            opacity: 0; width: 18px; height: 18px; border-radius: 5px;
            border: 1px solid var(--danger-border); background: var(--danger-soft);
            color: var(--danger); font-size: 10px; font-weight: 700; cursor: pointer;
        }
        .board-text-node:hover .board-text-del, .board-text-node:focus-within .board-text-del { opacity: 1; }
        .text-resize-handle {
            position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px;
            cursor: nwse-resize; display: flex; align-items: flex-end; justify-content: flex-end;
            color: var(--text-muted); font-size: 10px; opacity: 0; touch-action: none;
        }
        .board-text-node:hover .text-resize-handle, .board-text-node:focus-within .text-resize-handle { opacity: 1; }

        .video-widget-box { width: 350px; height: 255px; min-width: 230px; min-height: 180px; }
        .upload-video-btn {
            background: var(--emerald-soft); color: var(--emerald); border: 1px solid var(--emerald-border);
            padding: 6px 10px; border-radius: 7px; font-size: 11px; font-weight: 700;
            cursor: pointer; margin-bottom: 6px; width: 100%; text-align: center; display: block;
        }
        .video-widget-box video { width: 100%; flex: 1; min-height: 0; border-radius: 7px; background: #080c0b; object-fit: contain; }
        .video-unmute-hint {
            position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%);
            background: var(--emerald); color: #fff; border: none;
            padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 700;
            cursor: pointer; z-index: 5; display: none;
        }

        .essay-widget-box { width: 350px; height: 245px; min-width: 230px; min-height: 165px; }
        .essay-widget-box textarea {
            width: 100%; flex: 1; min-height: 0; border: 1px solid var(--border-strong); border-radius: 8px;
            padding: 10px; font-size: 13px; font-weight: 500; line-height: 1.45;
            background: var(--bg-elevated); color: var(--text-primary);
            resize: none; user-select: text; -webkit-user-select: text; outline: none;
        }
        .word-counter { margin-top: 6px; font-size: 11px; font-weight: 700; color: var(--text-secondary); flex-shrink: 0; }
        .photo-widget img { width: 100%; flex: 1; min-height: 0; object-fit: fill; border-radius: 7px; display: block; pointer-events: none; }

        .sticker-widget { width: 210px; height: 175px; min-width: 145px; min-height: 115px; background: #fef9c3; border: 1px solid #fde047; }
        .sticker-widget textarea {
            width: 100%; flex: 1; min-height: 0; resize: none; user-select: text; -webkit-user-select: text;
            background: transparent; border: none; color: #111815; font-weight: 600; font-size: 14px; line-height: 1.4; outline: none; padding: 4px;
        }
        .sticker-dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.2); }

        .speaking-widget-box { width: 345px; height: 248px; min-width: 280px; min-height: 225px; }
        .speaking-presets { display: flex; gap: 6px; margin-bottom: 8px; flex-shrink: 0; }
        .spk-preset-btn {
            flex: 1; border: 1px solid var(--border-strong); background: var(--bg-elevated);
            color: var(--text-secondary); padding: 6px 8px; border-radius: 8px;
            font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.14s;
        }
        .spk-preset-btn.active {
            background: var(--emerald-soft); color: var(--emerald); border-color: var(--emerald); font-weight: 700;
        }
        .speaking-studio-card {
            background: var(--bg-elevated); border: 1px solid var(--border-strong);
            border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
            display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
        }
        .speaking-clock {
            font-size: 22px; font-weight: 800; color: var(--emerald);
            font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
        }
        .spk-btns-wrap { display: flex; align-items: center; gap: 6px; }
        .spk-ctrl-btn {
            height: 30px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--border-strong);
            background: var(--bg-surface); color: var(--text-primary);
            font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .speaking-rec-btn {
            height: 30px; padding: 0 12px; border-radius: 7px; border: none;
            background: #dc2626; color: #fff; font-size: 11px; font-weight: 700;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
        }
        .speaking-rec-btn.recording {
            background: #d97706; animation: recPulse 1.2s infinite;
        }
        @keyframes recPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }

        .spk-custom-player {
            margin-top: auto; background: var(--bg-elevated); border: 1px solid var(--border-strong);
            border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 10px;
            flex-shrink: 0;
        }
        .spk-play-btn {
            width: 30px; height: 30px; border-radius: 50%; border: none;
            background: var(--emerald); color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .spk-play-btn:disabled { background: var(--border-strong); cursor: not-allowed; }
        .spk-play-btn svg { width: 13px; height: 13px; fill: currentColor; }
        .spk-wave-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .spk-progress-track {
            width: 100%; height: 6px; background: var(--border-strong);
            border-radius: 999px; overflow: hidden; cursor: pointer; position: relative;
        }
        .spk-progress-fill {
            width: 0%; height: 100%; background: var(--emerald); border-radius: 999px;
            transition: width 0.1s linear;
        }
        .spk-player-meta {
            display: flex; justify-content: space-between; font-size: 10px;
            font-weight: 600; color: var(--text-secondary); font-variant-numeric: tabular-nums;
        }

        .dict-widget-box { width: 345px; height: 275px; min-width: 260px; min-height: 210px; }
        .dict-search-row { display: flex; gap: 6px; margin-bottom: 8px; flex-shrink: 0; }
        .dict-input {
            flex: 1; padding: 6px 10px; border: 1px solid var(--border-strong); background: var(--bg-elevated);
            color: var(--text-primary); border-radius: 7px; font-size: 12px; font-weight: 600; outline: none;
            user-select: text; -webkit-user-select: text;
        }
        .dict-search-btn { background: var(--emerald); color: #fff; border: none; padding: 0 12px; border-radius: 7px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .dict-body {
            flex: 1; overflow-y: auto; background: var(--bg-elevated); border: 1px solid var(--border);
            border-radius: 7px; padding: 8px 10px; font-size: 12px; color: var(--text-primary);
            user-select: text; -webkit-user-select: text; line-height: 1.45;
        }
        .dict-links-row { display: flex; gap: 6px; margin-top: 6px; flex-shrink: 0; }
        .dict-ext-link {
            flex: 1; text-align: center; text-decoration: none; font-size: 10px; font-weight: 700;
            padding: 5px; border-radius: 6px; background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border);
        }

        @media (max-width: 860px) {
            .class-sidebar {
                position: fixed; top: 54px; right: 0; bottom: 0;
                box-shadow: -10px 0 30px rgba(0,0,0,0.4);
            }
            .lesson-title-text { max-width: 130px; }
        }

        /* Права ученика */
        body.role-student .widget-header { cursor: default; }
        body.role-student .widget-header .grip-bar { display: none; }
        body.role-student .widget .close-btn,
        body.role-student .widget .header-icon-btn,
        body.role-student .sticker-dot,
        body.role-student .upload-video-btn { display: none !important; }
        body.role-student .resize-handle,
        body.role-student .text-resize-handle { display: none !important; }
        body.role-student .board-text-drag,
        body.role-student .board-text-del { display: none !important; }
        body.role-student #btn-open-widgets,
        body.role-student #follow-switch-btn,
        body.role-student #btn-clear-board,
        body.role-student #btn-reset-all,
        body.role-student #btn-center-board,
        body.role-student #btn-timer-start { display: none !important; }
    </style>
</head>
<body class="role-teacher">

    <audio id="remote-voice-player" autoplay playsinline></audio>

    <div class="classroom-layout">
        <!-- 1. ВЕРХНЯЯ ПАНЕЛЬ -->
        <header class="class-topbar">
            <div class="topbar-left">
                <button class="top-btn" onclick="exitToCabinet()">← Кабинет</button>
                <span class="lesson-title-text font-display" id="board-title-label">Тема урока</span>

                <nav class="top-tabs">
                    <button class="top-tab active" id="top-tab-board" onclick="switchTopTab('board')">Доска</button>
                    <button class="top-tab" id="top-tab-notebook" onclick="switchTopTab('notebook')">Тетрадь</button>
                    <button class="top-tab" id="top-tab-materials" onclick="toggleWidgetsModal(event)">Материалы</button>
                </nav>
            </div>

            <div class="topbar-right">
                <div class="timer-pill">
                    <span class="timer-digits font-mono" id="timer-text">00:00</span>
                    <button class="timer-action-link" id="btn-timer-start" onclick="toggleLessonTimeMenu(event)">Старт</button>
                </div>

                <div class="follow-switch-wrap active" id="follow-switch-btn" onclick="toggleFollow()">
                    <div class="switch-track"><div class="switch-thumb"></div></div>
                    <span>Вести ученика</span>
                </div>

                <button class="top-btn" id="btn-open-widgets" onclick="toggleWidgetsModal(event)">
                    <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4l4 4M4 20h16"/></svg>
                    Файл
                </button>

                <button class="top-btn active" id="btn-toggle-chat" onclick="toggleChatSection()" title="Скрыть чат (оставить только камеры без пустой зоны)">
                    Чат
                </button>

                <button class="top-btn top-btn-icon" onclick="toggleSidebarPanel()" title="Скрыть / показать правую панель целиком">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
                </button>

                <button class="top-btn top-btn-danger" onclick="exitToCabinet()">Завершить урок</button>
            </div>
        </header>

        <!-- Всплывающее меню файлов и виджетов -->
        <div class="popover-box" id="widgets-modal">
            <div class="popover-head">
                <span class="font-display" style="font-size:12px;">Добавить на доску</span>
                <button class="close-btn" onclick="closePopovers()">✕</button>
            </div>
            <div class="widget-grid">
                <label for="photo-upload-input" class="widget-pick-btn">Фото / Учебник</label>
                <button class="widget-pick-btn" onclick="startWidgetPlacement('video', 'Видео / Аудио')">Видео / Аудио</button>
                <button class="widget-pick-btn" onclick="startWidgetPlacement('essay', 'Редактор Эссе')">Редактор Эссе</button>
                <button class="widget-pick-btn" onclick="startWidgetPlacement('sticker', 'Стикер')">Стикер</button>
                <button class="widget-pick-btn" onclick="startWidgetPlacement('speaking', 'Speaking')">Speaking</button>
                <button class="widget-pick-btn" onclick="startWidgetPlacement('dict', 'Словарь')">Словарь</button>
            </div>
            <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border);" id="btn-reset-all">
                <button class="top-btn top-btn-danger" style="width:100%; height:30px; font-size:11px;" onclick="resetSavedLesson(); closePopovers();">
                    Очистить всю доску целиком
                </button>
            </div>
            <input type="file" id="photo-upload-input" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
        </div>

        <!-- Всплывающее меню таймера -->
        <div class="popover-box" id="lesson-time-popover" style="width:240px; right:260px;">
            <div class="popover-head">
                <span class="font-display" style="font-size:12px;">Таймер урока</span>
                <button class="close-btn" onclick="closePopovers()">✕</button>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
                <button class="widget-pick-btn font-mono" onclick="triggerLessonStart(60)">60 минут</button>
                <button class="widget-pick-btn font-mono" onclick="triggerLessonStart(45)">45 минут</button>
                <button class="widget-pick-btn font-mono" onclick="triggerLessonStart(30)">30 минут</button>
                <button class="widget-pick-btn" id="btn-pause-timer" onclick="togglePauseLessonTimer(); closePopovers();">Пауза / Продолжить</button>
                <button class="top-btn top-btn-danger" style="height:30px; font-size:11px; margin-top:4px;" onclick="stopLessonTimer(); closePopovers();">Сбросить таймер</button>
            </div>
        </div>

        <div id="placement-banner">
            <span id="placement-text">Нажмите на доску, чтобы разместить виджет</span>
            <button class="placement-cancel-btn" onclick="cancelPendingPlacement()">Отмена</button>
        </div>

        <!-- 2. ОСНОВНАЯ ОБЛАСТЬ: ХОЛСТ + ПРАВАЯ КОЛОНКА -->
        <div class="class-body">
            <div id="board-viewport">
                <div class="follow-status-pill" id="follow-status-pill">
                    <span class="follow-status-dot"></span>
                    <span id="follow-status-text">Ученик следует за вашей доской</span>
                </div>

                <!-- Левая вертикальная панель -->
                <div class="left-toolbar">
                    <button class="v-tool-btn" id="tool-pan" onclick="setTool('pan')" title="Двигать доску">
                        <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M12 2l-3 3m3-3l3 3M12 22l-3-3m3 3l3-3M2 12l3-3m-3 3l3 3M22 12l-3-3m3 3l-3 3"/></svg>
                    </button>
                    <button class="v-tool-btn" data-tool="pencil" onclick="selectDrawTool('pencil', 'Карандаш')" title="Карандаш">
                        <svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                    </button>
                    <button class="v-tool-btn active" data-tool="marker" onclick="selectDrawTool('marker', 'Маркер')" title="Маркер">
                        <svg viewBox="0 0 24 24"><path d="m15 5 4 4M13 7 8 12v4h4l5-5m-4-4 3-3 4 4-3 3m-9 9H4v-4"/></svg>
                    </button>
                    <button class="v-tool-btn" data-tool="highlighter" onclick="selectDrawTool('highlighter', 'Текстовыделитель')" title="Текстовыделитель">
                        <svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
                    </button>
                    <button class="v-tool-btn" data-tool="text" onclick="setTool('text')" title="Текст">
                        <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
                    </button>
                    <button class="v-tool-btn" data-tool="eraser" onclick="setTool('eraser')" title="Ластик (удаляет линию целиком)">
                        <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21M22 21H7M5 11l9 9"/></svg>
                    </button>
                </div>

                <!-- Карточка настроек цвета и толщины -->
                <div class="tool-settings-card" id="tool-settings-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="tool-settings-title" id="settings-tool-title">Маркер</span>
                        <button class="close-btn" style="height:18px; padding:0 4px;" onclick="document.getElementById('tool-settings-card').style.display='none'">✕</button>
                    </div>
                    <div class="color-row" id="color-swatch-group">
                        <div class="color-swatch active" style="background:#10a372;" onclick="pickColor('#10a372', this)"></div>
                        <div class="color-swatch" style="background:#f2f7f5;" onclick="pickColor('#f2f7f5', this)"></div>
                        <div class="color-swatch" style="background:#3b82f6;" onclick="pickColor('#3b82f6', this)"></div>
                        <div class="color-swatch" style="background:#f43f5e;" onclick="pickColor('#f43f5e', this)"></div>
                        <div class="color-swatch" style="background:#f59e0b;" onclick="pickColor('#f59e0b', this)"></div>
                        <div class="color-swatch" style="background:#a855f7;" onclick="pickColor('#a855f7', this)"></div>
                    </div>
                    <div class="thickness-label">Толщина</div>
                    <input type="range" min="2" max="24" value="5" class="thickness-range" id="stroke-size-slider" oninput="changeStrokeSize(this.value)">
                </div>

                <!-- Нижний левый островок -->
                <div class="bottom-left-island">
                    <button class="island-btn" onclick="undoAction()" title="Отменить (Ctrl+Z)">
                        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
                    </button>
                    <button class="island-btn" onclick="redoAction()" title="Вернуть (Ctrl+Y)">
                        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
                    </button>
                    <button class="island-btn danger" id="btn-clear-board" onclick="clearBoard(true)" title="Очистить все линии">
                        <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>

                <!-- Нижний правый островок: Масштаб -->
                <div class="bottom-right-island">
                    <button class="island-btn" onclick="changeZoom(-0.15)" title="Отдалить">−</button>
                    <span class="zoom-pct font-mono" id="zoom-display" onclick="resetZoom()">100%</span>
                    <button class="island-btn" onclick="changeZoom(0.15)" title="Приблизить">+</button>
                    <button class="island-btn" id="btn-center-board" onclick="returnToCenter(true)" title="В центр доски">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>
                    </button>
                </div>

                <!-- Мир доски -->
                <div id="board-world">
                    <div id="dynamic-items"></div>
                    <canvas id="canvas" width="4200" height="3000"></canvas>
                    <canvas id="temp-canvas" width="4200" height="3000"></canvas>
                    <canvas id="remote-live-canvas" width="4200" height="3000"></canvas>

                    <div id="remote-peer-cursor">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--emerald)" stroke="#fff" stroke-width="1.5"><path d="M4 4l7.07 17 2.51-7.39L21 11.07z"/></svg>
                        <div class="peer-cursor-tag" id="remote-peer-cursor-label">Собеседник</div>
                    </div>
                </div>
            </div>

            <!-- 3. ПРАВАЯ КОЛОНКА -->
            <aside class="class-sidebar" id="class-sidebar">
                <div class="pip-camera-stage" id="pip-camera-stage">
                    <div class="cam-slot cam-main" id="remote-cam-slot" onclick="handleCamSlotClick('remote')" title="Нажмите на малое окно, чтобы поменять камеры местами">
                        <div class="cam-slot-placeholder" id="remote-placeholder">Камера собеседника</div>
                        <img id="remoteRelayImg" alt="">
                        <video id="remoteVideo" autoplay muted playsinline webkit-playsinline></video>
                        <span class="cam-slot-badge" id="remote-role-badge">Собеседник</span>
                    </div>

                    <div class="cam-slot cam-pip" id="local-cam-slot" onclick="handleCamSlotClick('local')" title="Нажмите, чтобы сделать вашу камеру главной">
                        <div class="cam-slot-placeholder" id="local-pip-label">Вы</div>
                        <video id="localVideo" autoplay muted playsinline webkit-playsinline></video>
                        <span class="cam-slot-badge" id="local-role-badge">Вы</span>
                    </div>
                </div>

                <div class="media-bar">
                    <div class="media-circles">

    <script>
        // ================= 1. ВСЕ ПЕРЕМЕННЫЕ И КОНСТАНТЫ В НАЧАЛЕ СКРИПТА =================
        const firebaseConfig = {
            apiKey: "AIzaSyAmlK0KFtxAWUNdEw8OEK0sZzWgf_KUIyE",
            authDomain: "english-space-13381.firebaseapp.com",
            databaseURL: "https://english-space-13381-default-rtdb.firebaseio.com",
            projectId: "english-space-13381",
            storageBucket: "english-space-13381.firebasestorage.app",
            messagingSenderId: "54553238353",
            appId: "1:54553238353:web:e269ccf594e77f21bad170",
            measurementId: "G-RQ2YW5CYV7"
        };

        const RTC_CONFIG = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun.cloudflare.com:3478' }
            ]
        };

        const STICKER_THEMES = {
            yellow: { bg: '#fef9c3', border: '#fde047' },
            mint:   { bg: '#d1fae5', border: '#6ee7b7' },
            sky:    { bg: '#e0f2fe', border: '#7dd3fc' },
            pink:   { bg: '#fce7f3', border: '#f9a8d4' }
        };

        const CENTER_X = -1400;
        const CENTER_Y = -950;

        const isLightTheme = localStorage.getItem('es_theme') === 'light';
        if (isLightTheme) {
            document.body.classList.add('light-theme');
        }

        let db = null, auth = null, roomRef = null;
        const urlParams = new URLSearchParams(window.location.search);
        const rawRoom = urlParams.get('room') || 'default_room';
        const boardTitleParam = urlParams.get('title') || 'Доска урока';
        document.getElementById('board-title-label').innerText = boardTitleParam;

        const ROOM_ID = rawRoom.replace(/[^a-zA-Z0-9_-]/g, '_');
        const LOCAL_BOARD_KEY = 'es_board_cache_' + ROOM_ID;
        const localChannel = new BroadcastChannel('es_live_' + ROOM_ID);

        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.database();
            roomRef = db.ref('boards/' + ROOM_ID);
        } catch (e) {}

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const tempCanvas = document.getElementById('temp-canvas');
        const tempCtx = tempCanvas.getContext('2d');
        const remoteLiveCanvas = document.getElementById('remote-live-canvas');
        const remoteLiveCtx = remoteLiveCanvas.getContext('2d');

        const boardWorld = document.getElementById('board-world');
        const viewport = document.getElementById('board-viewport');
        const remotePeerCursor = document.getElementById('remote-peer-cursor');
        const widgetsModal = document.getElementById('widgets-modal');
        const dynamicItems = document.getElementById('dynamic-items');
        const lessonTimePopover = document.getElementById('lesson-time-popover');
        const placementBanner = document.getElementById('placement-banner');
        const remoteVoicePlayer = document.getElementById('remote-voice-player');
        const chatMessagesList = document.getElementById('chat-messages-list');
        const toolSettingsCard = document.getElementById('tool-settings-card');

        // Состояние WebRTC и Медиа (объявлено до любых вызовов функций!)
        let pc = null;
        let localStream = null;
        let remoteVideoStream = new MediaStream();
        let remoteAudioStream = new MediaStream();
        let micActive = false;
        let cameraActive = false;
        let remoteSoundMuted = false;
        let makingOffer = false;
        let ignoreOffer = false;
        let pendingIceCandidates = [];
        let rtcSignalRef = null;
        let offerDebounceTimer = null;
        let p2pVideoWorking = false;
        let p2pAudioWorking = false;

        let videoRelayTimer = null;
        let isUploadingFrame = false;
        let relayCaptureCanvas = document.createElement('canvas');
        relayCaptureCanvas.width = 300;
        relayCaptureCanvas.height = 220;
        let relayCaptureCtx = relayCaptureCanvas.getContext('2d');

        let audioCtx = null;
        let audioProcessor = null;
        let audioSourceNode = null;
        let nextAudioPlayTime = 0;

        // Вспомогательные кэши и объекты виджетов
        const pencilPatternCache = {};
        const speakingRecorders = {};
        const speakingTimers = {};
        const speakingPlayers = {};
        let lastPinchDist = null;

        function detectInitialRole() {
            const paramRole = urlParams.get('role');
            if (paramRole === 'teacher' || paramRole === 'student') return paramRole;
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith('es_role_')) {
                    const r = localStorage.getItem(k);
                    if (r === 'teacher' || r === 'student') return r;
                }
            }
            return 'teacher';
        }

        let role = detectInitialRole();
        let peerRole = role === 'teacher' ? 'student' : 'teacher';
        let myClientId = 'cl_' + Math.random().toString(36).slice(2, 9);

        let myUserName = role === 'teacher' ? 'Преподаватель' : 'Ученик';
        let peerUserName = peerRole === 'teacher' ? 'Преподаватель' : 'Ученик';
        let roomParticipants = {};

        function detectLocalUserName() {
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && k.startsWith('es_user_')) {
                        const parsed = JSON.parse(localStorage.getItem(k));
                        if (parsed && parsed.role === role && parsed.profile && parsed.profile.name) {
                            return parsed.profile.name;
                        }
                    }
                }
            } catch (e) {}
            return role === 'teacher' ? 'Преподаватель' : 'Ученик';
        }
        myUserName = detectLocalUserName();

        let tool = 'marker';
        let lastDrawTool = 'marker';
        let currentColor = '#10a372';
        let baseStrokeSize = 5;

        let drawing = false;
        let panning = false;
        let followMode = true;
        let boardX = CENTER_X, boardY = CENTER_Y;
        let boardScale = 1;

        let targetFollowX = CENTER_X;
        let targetFollowY = CENTER_Y;
        let targetFollowScale = 1;

        let peerCursorTargetX = 1800, peerCursorTargetY = 1200;
        let peerCursorCurX = 1800, peerCursorCurY = 1200;
        let peerCursorVisible = false;

        let startPanX = 0, startPanY = 0;
        let currentStrokePoints = [];
        let currentStrokeId = null;
        let strokeBounds = { minX: 0, minY: 0, maxX: 0, maxY: 0 };

        let photoZIndex = 15;
        let topZIndex = 35;

        let pendingWidgetType = null;
        let strokeHistory = [];
        const deletedStrokeIds = new Set();
        let actionHistory = [];
        let redoActionStack = [];
        let chatHistory = [];

        let timerInterval = null;
        let timerStateData = { active: false, paused: false, endTimeMs: 0, remainingSeconds: 0 };
        let lastMoveSentTime = 0;
        let lastLiveStrokeSentTime = 0;
        let saveStateDebounceTimer = null;
        let isLocalCamMain = false;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        tempCtx.lineCap = 'round';
        tempCtx.lineJoin = 'round';
        remoteLiveCtx.lineCap = 'round';
        remoteLiveCtx.lineJoin = 'round';

        // ================= 2. ФУНКЦИИ ИНТЕРФЕЙСА И СИНХРОНИЗАЦИИ =================
        if (auth) {
            auth.onAuthStateChanged(async (u) => {
                if (!u) return;
                try {
                    const cached = localStorage.getItem('es_user_' + u.uid);
                    if (cached) {
                        const parsed = JSON.parse(cached);
                        if (parsed?.profile?.name) myUserName = parsed.profile.name;
                    }
                    if (db) {
                        const snap = await db.ref(`users/${u.uid}/profile/name`).once('value');
                        if (snap.val()) myUserName = snap.val();
                    }
                } catch (e) {}
                publishMyParticipantInfo();
                updateParticipantLabelsUI();
            });
        }

        function publishMyParticipantInfo() {
            if (!roomRef) return;
            roomRef.child(`participants/${role}`).set({
                name: myUserName,
                role: role,
                updatedAt: Date.now()
            }).catch(() => {});
        }

        function updateParticipantLabelsUI() {
            const locBadge = document.getElementById('local-role-badge');
            const remBadge = document.getElementById('remote-role-badge');
            const curLabel = document.getElementById('remote-peer-cursor-label');
            const locPipLbl = document.getElementById('local-pip-label');
            const remPlaceholder = document.getElementById('remote-placeholder');

            if (locBadge) locBadge.innerText = myUserName;
            if (remBadge) remBadge.innerText = peerUserName;
            if (curLabel) curLabel.innerText = peerUserName;
            if (!cameraActive && locPipLbl) {
                locPipLbl.innerText = myUserName;
            }
            if (remPlaceholder && remPlaceholder.style.display !== 'none') {
                remPlaceholder.innerText = `Камера: ${peerUserName}`;
            }
            renderChatMessages();
        }

        function handleCamSlotClick(clickedSlot) {
            if (clickedSlot === 'local' && !isLocalCamMain) {
                isLocalCamMain = true;
            } else if (clickedSlot === 'remote' && isLocalCamMain) {
                isLocalCamMain = false;
            } else {
                return;
            }
            const remoteSlot = document.getElementById('remote-cam-slot');
            const localSlot = document.getElementById('local-cam-slot');
            remoteSlot.className = isLocalCamMain ? 'cam-slot cam-pip' : 'cam-slot cam-main';
            localSlot.className = isLocalCamMain ? 'cam-slot cam-main' : 'cam-slot cam-pip';
        }

        function toggleChatSection() {
            const chatSec = document.getElementById('chat-section');
            const sidebar = document.getElementById('class-sidebar');
            const topChatBtn = document.getElementById('btn-toggle-chat');
            const isHidden = chatSec.classList.toggle('hidden');
            sidebar.classList.toggle('chat-hidden-mode', isHidden);
            topChatBtn.classList.toggle('active', !isHidden);
            topChatBtn.innerText = isHidden ? 'Показать чат' : 'Чат';
            setTimeout(applyBoardTransform, 30);
        }

        function startSmoothAnimationLoop() {
            function step() {
                if (role === 'student' && followMode) {
                    const dx = targetFollowX - boardX;
                    const dy = targetFollowY - boardY;
                    const ds = targetFollowScale - boardScale;
                    if (Math.abs(dx) > 0.35 || Math.abs(dy) > 0.35 || Math.abs(ds) > 0.0015) {
                        boardX += dx * 0.25;
                        boardY += dy * 0.25;
                        boardScale += ds * 0.25;
                        updateZoomUI();
                        applyBoardTransform();
                    }
                }

                if (peerCursorVisible) {
                    peerCursorCurX += (peerCursorTargetX - peerCursorCurX) * 0.35;
                    peerCursorCurY += (peerCursorTargetY - peerCursorCurY) * 0.35;
                    remotePeerCursor.style.transform = `translate3d(${peerCursorCurX.toFixed(1)}px, ${peerCursorCurY.toFixed(1)}px, 0)`;
                }

                requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function applyVerifiedRole(verifiedRole) {
            role = (verifiedRole === 'student') ? 'student' : 'teacher';
            peerRole = role === 'teacher' ? 'student' : 'teacher';
            document.body.className = (localStorage.getItem('es_theme') === 'light' ? 'light-theme ' : '') + 'role-' + role;

            const isTeacher = role === 'teacher';
            document.getElementById('follow-status-text').innerText = isTeacher
                ? 'Ученик следует за вашей доской'
                : 'Вы следуете за доской преподавателя';

            updateParticipantLabelsUI();
            updateStudentPanLock();
        }

        function switchTopTab(tab) {
            document.getElementById('top-tab-board').classList.toggle('active', tab === 'board');
            document.getElementById('top-tab-notebook').classList.toggle('active', tab === 'notebook');
            if (tab === 'notebook') {
                const existingEssay = dynamicItems.querySelector('.essay-widget-box');
                if (existingEssay) {
                    existingEssay.style.display = 'flex';
                    bringToFront(existingEssay);
                } else if (role === 'teacher') {
                    const vw = viewport.clientWidth || window.innerWidth;
                    const vh = viewport.clientHeight || window.innerHeight;
                    const pt = screenToWorld(vw / 2 - 175, vh / 2 - 120);
                    createEssayWidget({ id: 'essay-' + Date.now(), left: Math.round(pt.x), top: Math.round(pt.y), width: 360, height: 260, text: '' }, true, true);
                }
            }
        }

        function toggleSidebarPanel() {
            document.getElementById('class-sidebar').classList.toggle('collapsed');
            setTimeout(applyBoardTransform, 40);
        }

        function exitToCabinet() {
            flushBoardStateImmediate();
            cleanupWebRTC();
            if (window.parent && window.parent !== window && typeof window.parent.closeBoardRoom === 'function') {
                window.parent.closeBoardRoom();
            } else {
                window.location.href = 'index.html';
            }
        }

        function broadcastEvent(payload) {
            const msg = { ...payload, sender: myClientId, ts: Date.now() };
            try { localChannel.postMessage(msg); } catch (e) {}
            if (roomRef) {
                try { roomRef.child('events').push(msg).catch(() => {}); } catch (e) {}
            }
        }

        localChannel.onmessage = (ev) => {
            if (ev.data && ev.data.sender !== myClientId) {
                handleRemoteEvent(ev.data);
            }
        };

        function restoreSnapshotData(val) {
            if (!val) return;
            if (Array.isArray(val.deletedIds)) {
                val.deletedIds.forEach(id => deletedStrokeIds.add(id));
            }
            if (Array.isArray(val.strokeHistory)) {
                strokeHistory = val.strokeHistory.filter(s => s && (!s.id || !deletedStrokeIds.has(s.id)));
                redrawAllStrokes();
            }
            if (val.chatHistory && Array.isArray(val.chatHistory)) {
                chatHistory = val.chatHistory;
                renderChatMessages();
            }
            if (val.items && Array.isArray(val.items)) {
                dynamicItems.innerHTML = '';
                val.items.forEach(item => {
                    if (item.type === 'video') createVideoWidget(item, false, false);
                    else if (item.type === 'essay') createEssayWidget(item, false, false);
                    else if (item.type === 'photo') spawnPhotoWidget(item, false, false);
                    else if (item.type === 'sticker') createSticker(item, false, false);
                    else if (item.type === 'speaking') createSpeakingWidget(item, false, false);
                    else if (item.type === 'dict') createDictWidget(item, false, false);
                    else if (item.type === 'text') createTextNode(item, false, false);
                });
            }
        }

        function initRealtimeSync() {
            try {
                const localRaw = localStorage.getItem(LOCAL_BOARD_KEY);
                if (localRaw) restoreSnapshotData(JSON.parse(localRaw));
            } catch (e) {}

            if (!roomRef) return;
            publishMyParticipantInfo();

            try {
                roomRef.child('participants').on('value', (snap) => {
                    roomParticipants = snap.val() || {};
                    if (roomParticipants[peerRole]?.name) {
                        peerUserName = roomParticipants[peerRole].name;
                    }
                    if (roomParticipants[role]?.name && (myUserName === 'Преподаватель' || myUserName === 'Ученик')) {
                        myUserName = roomParticipants[role].name;
                    }
                    updateParticipantLabelsUI();
                });

                roomRef.child('snapshot').once('value', (snap) => {
                    const val = snap.val();
                    if (val) restoreSnapshotData(val);
                });

                roomRef.child('timerState').on('value', (snap) => {
                    const st = snap.val();
                    if (!st) return;
                    applySyncedTimerState(st);
                });

                roomRef.child('teacherMove').on('value', (snap) => {
                    const data = snap.val();
                    if (!data || data.sender === myClientId) return;
                    handleTeacherMoveData(data);
                });

                roomRef.child('studentCursor').on('value', (snap) => {
                    const data = snap.val();
                    if (!data || data.sender === myClientId) return;
                    setRemoteCursorTarget(data.worldX, data.worldY);
                });

                roomRef.child(`liveStroke/${peerRole}`).on('value', (snap) => {
                    const data = snap.val();
                    remoteLiveCtx.clearRect(0, 0, remoteLiveCanvas.width, remoteLiveCanvas.height);
                    if (data && data.active && Array.isArray(data.points) && data.points.length > 0) {
                        renderSmoothPath(remoteLiveCtx, data.points, data.color, data.strokeTool, data.size);
                    }
                });

                let initialEventsSkipped = false;
                roomRef.child('events').limitToLast(1).on('child_added', (snap) => {
                    if (!initialEventsSkipped) { initialEventsSkipped = true; return; }
                    const data = snap.val();
                    if (!data || data.sender === myClientId) return;
                    handleRemoteEvent(data);
                });
            } catch (e) {}
        }

        function setRemoteCursorTarget(wx, wy) {
            if (wx === undefined || wy === undefined) return;
            if (!peerCursorVisible) {
                peerCursorVisible = true;
                peerCursorCurX = wx;
                peerCursorCurY = wy;
                remotePeerCursor.style.display = 'block';
            }
            peerCursorTargetX = wx;
            peerCursorTargetY = wy;
        }

        function resolveChatAuthorName(msg) {
            if (msg.authorRole === role && myUserName) return myUserName;
            if (msg.authorRole === peerRole && peerUserName) return peerUserName;
            if (msg.author && msg.author !== 'Преподаватель' && msg.author !== 'Ученик') return msg.author;
            if (msg.author === 'Преподаватель') return roomParticipants.teacher?.name || (role === 'teacher' ? myUserName : peerUserName);
            if (msg.author === 'Ученик') return roomParticipants.student?.name || (role === 'student' ? myUserName : peerUserName);
            return msg.author || 'Участник';
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input-field');
            const text = input.value.trim();
            if (!text) return;
            const msgObj = {
                author: myUserName,
                authorRole: role,
                text,
                ts: Date.now()
            };
            chatHistory.push(msgObj);
            if (chatHistory.length > 60) chatHistory.shift();
            input.value = '';
            renderChatMessages();
            saveBoardState();
            broadcastEvent({ type: 'chat_msg', msg: msgObj });
        }

        function renderChatMessages() {
            if (!chatHistory || chatHistory.length === 0) {
                chatMessagesList.innerHTML = '<div class="chat-empty">Сообщений пока нет</div>';
                return;
            }
            chatMessagesList.innerHTML = chatHistory.map(m => {
                const displayAuthor = resolveChatAuthorName(m);
                const isMine = m.authorRole ? (m.authorRole === role) : (displayAuthor === myUserName);
                return `
                    <div class="chat-msg ${isMine ? 'mine' : ''}">
                        <div class="chat-msg-author">${displayAuthor.replace(/</g, '&lt;')}</div>
                        <div>${(m.text || '').replace(/</g, '&lt;')}</div>
                    </div>
                `;
            }).join('');
            chatMessagesList.scrollTop = chatMessagesList.scrollHeight;
        }

        function sendTeacherViewportSync(worldX, worldY) {
            if (role !== 'teacher') return;
            const vw = viewport.clientWidth || window.innerWidth;
            const vh = viewport.clientHeight || window.innerHeight;
            const movePayload = {
                type: 'teacher_move_local',
                sender: myClientId,
                worldX: worldX !== undefined ? worldX : Math.round((vw / 2 - boardX) / boardScale),
                worldY: worldY !== undefined ? worldY : Math.round((vh / 2 - boardY) / boardScale),
                boardX: Math.round(boardX),
                boardY: Math.round(boardY),
                boardScale,
                vw, vh, followMode
            };
            try { localChannel.postMessage(movePayload); } catch (err) {}
            if (roomRef) {
                try { roomRef.child('teacherMove').set(movePayload).catch(() => {}); } catch (err) {}
            }
        }

        function handleTeacherMoveData(data) {
            followMode = data.followMode;
            document.getElementById('follow-status-pill').style.display = followMode ? 'flex' : 'none';
            updateStudentPanLock();

            if (data.worldX !== undefined) {
                setRemoteCursorTarget(data.worldX, data.worldY);
            }

            if (role === 'student' && followMode) {
                const tScale = data.boardScale || 1;
                targetFollowScale = tScale;
                const myVw = viewport.clientWidth || window.innerWidth;
                const myVh = viewport.clientHeight || window.innerHeight;
                const tVw = data.vw || myVw;
                const tVh = data.vh || myVh;
                const centerWorldX = (tVw / 2 - data.boardX) / tScale;
                const centerWorldY = (tVh / 2 - data.boardY) / tScale;
                const minX = Math.min(0, myVw - canvas.width * tScale);
                const minY = Math.min(0, myVh - canvas.height * tScale);

                targetFollowX = Math.min(0, Math.max(minX, myVw / 2 - centerWorldX * tScale));
                targetFollowY = Math.min(0, Math.max(minY, myVh / 2 - centerWorldY * tScale));
            }
        }

        function getPencilPattern(colorHex) {
            if (pencilPatternCache[colorHex]) return pencilPatternCache[colorHex];
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 24; pCanvas.height = 24;
            const pCtx = pCanvas.getContext('2d');
            pCtx.fillStyle = colorHex;
            for (let x = 0; x < 24; x++) {
                for (let y = 0; y < 24; y++) {
                    const rnd = Math.random();
                    if (rnd > 0.32) {
                        pCtx.globalAlpha = rnd * 0.85;
                        pCtx.fillRect(x, y, 1.3, 1.3);
                    }
                }
            }
            const pattern = ctx.createPattern(pCanvas, 'repeat');
            pencilPatternCache[colorHex] = pattern;
            return pattern;
        }

        function bringToFront(el) {
            if (el.classList.contains('locked-widget')) return;
            if (el.classList.contains('photo-widget')) {
                photoZIndex = photoZIndex >= 22 ? 15 : photoZIndex + 1;
                el.style.zIndex = photoZIndex;
            } else {
                topZIndex = topZIndex >= 48 ? 36 : topZIndex + 1;
                el.style.zIndex = topZIndex;
            }
        }

        function startWidgetPlacement(type, label) {
            if (role === 'student') return;
            widgetsModal.style.display = 'none';
            pendingWidgetType = type;
            document.getElementById('placement-text').innerText = `Нажмите на доску: ${label}`;
            placementBanner.style.display = 'flex';
            viewport.style.cursor = 'copy';
        }

        function cancelPendingPlacement() {
            pendingWidgetType = null;
