<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Обучение вашего ребёнка · Орбита</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="assets/learning.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script><script src="assets/access.js"></script><script src="assets/learning-core.js"></script><script src="assets/portal.js"></script></head><body class="portal-page" data-portal="family"><main class="portal-wrap"><header class="portal-top"><a href="index.html">◉ Орбита</a><button id="portal-logout" hidden onclick="portalLogout()">Выйти</button></header><h1>Обучение вашего ребёнка</h1><p>Опубликованные итоги, навыки и следующий шаг.</p><p id="portal-message" class="portal-message" role="status"></p><section id="portal-auth" class="learning-card portal-auth"><h2>Войти в аккаунт</h2><p>Используйте свою почту. Для отчётов родителю — адрес из приглашения.</p><form onsubmit="portalLogin(event)"><label>Почта<input id="portal-email" class="field-input" type="email" name="email" autocomplete="email" required></label><label>Пароль<input class="field-input" type="password" name="password" autocomplete="current-password" minlength="6" required></label><div class="ledger-actions"><button class="btn btn-jade" type="submit" value="login">Войти</button><button class="btn" type="submit" value="register">Создать аккаунт</button></div></form><button class="btn" onclick="portalGoogle()">Войти через Google</button><button class="btn" onclick="portalResetPassword()">Забыли пароль?</button></section><section id="portal-verify" class="learning-card" hidden><h2>Подтвердите почту</h2><p>Перейдите по ссылке в письме и вернитесь на эту страницу.</p><button class="btn btn-jade" onclick="portalVerify(false)">Я подтвердил почту</button><button class="btn" onclick="portalVerify(true)">Отправить письмо ещё раз</button></section><section id="portal-content"></section></main></body></html>
